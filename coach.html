<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMPWR Coach Board</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Mr+Dafoe&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#12161F;--red:#EB5345;--bg:#fff;--fg:#12161F;--card:#F3F4F6;--line:#D9DCE1;--mute:#8a8f98}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Montserrat,sans-serif;max-width:1000px;margin:auto;padding:16px 16px 120px}
header{display:flex;align-items:center;gap:16px;margin-bottom:10px}
header img{height:44px;flex:0 0 auto}
#hdrT{flex:1;min-width:0;display:flex;align-items:center;gap:12px;overflow:hidden;white-space:nowrap}
#hdrT .ph{font-family:'Bebas Neue';font-size:26px;letter-spacing:.04em}
#hdrT .cur{font-family:'Mr Dafoe';color:var(--red);font-size:44px;line-height:1.1}
#dt{font-family:'Bebas Neue';font-size:16px;letter-spacing:.05em;white-space:nowrap;flex:0 0 auto;color:#5d626b}
#sess{font:inherit;letter-spacing:inherit;color:#fff;background:var(--ink);border:0;border-radius:6px;padding:3px 8px;cursor:pointer}
h1{font-family:'Bebas Neue';font-size:40px;letter-spacing:.04em;line-height:1}
h2{font-family:'Mr Dafoe';font-weight:400;font-size:34px;margin:-4px 0 10px}
.card{background:var(--card);border-radius:12px;padding:14px;margin:12px 0}
input{font:inherit;width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--fg)}
button{font:inherit;cursor:pointer}
.main{font-family:'Bebas Neue';font-size:24px;letter-spacing:.05em;width:100%;padding:12px;border:0;border-radius:10px;background:var(--red);color:#fff;margin-top:10px}
.main:disabled{opacity:.5}
.hidden{display:none!important}
#results button{display:block;width:100%;text-align:left;padding:12px;margin-top:6px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:600}
#chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--ink);color:#fff;border:0;border-radius:20px;padding:8px 14px;font-weight:600}
.chip::after{content:' ✕';opacity:.6}
#tabs{display:flex;gap:8px;overflow-x:auto;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
#tabs button{flex:1 0 auto;font-family:'Bebas Neue';font-size:20px;letter-spacing:.05em;padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
#tabs button.on{background:var(--red);border-color:var(--red);color:#fff}
.band{display:flex;justify-content:space-between;align-items:center;background:var(--red);color:#fff;border-radius:10px;padding:8px 14px;margin-top:6px}
.band .nm{font-family:'Bebas Neue';font-size:30px;letter-spacing:.04em}
.band .q{font-family:'Mr Dafoe';font-size:28px;margin-left:12px}
.ex{border-left:6px solid var(--line)}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.exhead h3{font-family:'Bebas Neue';font-size:26px;letter-spacing:.03em}
.exhead .lbl{color:var(--mute);margin-right:8px}
.exhead b{font-family:'Bebas Neue';font-size:22px;white-space:nowrap}
.mrow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.who{font-weight:800;font-size:15px}
.who small{display:block;font-weight:400;font-size:12px;color:var(--mute);margin-top:3px}
.sets{display:flex;flex-wrap:wrap;gap:8px}
.st{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 6px}
.st span{font-family:'Bebas Neue';font-size:18px;color:var(--mute);width:16px;text-align:center}
.st input{width:70px;padding:8px 6px;font-size:17px;text-align:center;border:0;background:var(--card)}
.st input[data-r]{width:52px}.st input[data-min]{width:66px;font-size:15px}
.st i{font-style:normal;color:var(--mute)}
.same{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;padding:0 12px;font-weight:700;font-size:13px}
.st input[data-w]::placeholder{color:#b5b9c0}
.plus{border:1px dashed var(--line);background:none;border-radius:10px;padding:0 12px;font-weight:700;color:var(--mute)}
.mtot{font-size:12px;color:var(--mute);margin-top:6px}
.cgrid{display:flex;flex-wrap:wrap;gap:8px}.cf{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase}.cf input{width:90px;padding:8px;font-size:16px;text-align:center}.cf select{padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit}
.opt{margin-bottom:8px}.opt button::before{content:'☐ '}.opt button.on::before{content:'☑ '}
.st i.bw{font-family:'Bebas Neue';font-size:16px;color:var(--ink);letter-spacing:.03em}
.cnote{margin-top:6px;padding:7px 10px;font-size:13px;border-style:dashed}.cnote:not(:placeholder-shown){border:1px solid var(--red);font-weight:600}.rule{font-size:13px;font-weight:700;margin:4px 0 2px}.mtot b{color:#2FA84F}.st input.lo{background:#fde3e0}
.xs{cursor:pointer;color:var(--mute);font-weight:800;padding:0 2px 0 6px;font-style:normal}
.fillr,.fille{border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:10px;padding:0 12px;font-weight:700;font-size:13px}.fille{padding:8px 12px;margin:6px 0 2px}
.mod{border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 12px;font-weight:700;font-size:13px;color:var(--ink)}
.mrow.modded .who{color:var(--red)}
.mtag{display:block;font-size:12px;font-weight:700;color:var(--red);margin-top:4px}
.mp{grid-column:1/-1;background:var(--card);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.mp .lab{font-family:'Bebas Neue';font-size:17px;letter-spacing:.06em;color:#5d626b}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 12px;font-weight:600;font-size:13px}
.pills button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mp .alts{max-height:190px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.mp .alts button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;font-weight:600;font-size:13px}
.mp .alts button.on{border:2px solid var(--red)}
.mp .rs{display:flex;gap:8px;align-items:center}.mp .rs input{width:80px;text-align:center}
.mp .act{display:flex;gap:8px}.mp .act button{flex:1;border:0;border-radius:8px;padding:10px;font-weight:800}
.chz{font-family:'Bebas Neue';font-size:20px;letter-spacing:.08em;margin:14px 0 -4px}
.st.saved{border-color:#2FA84F;box-shadow:inset 3px 0 0 #2FA84F}#resume{border:2px solid var(--red)}#autos{font-size:12px;color:var(--mute);text-align:center;margin-top:6px}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px}
#bar .in{max-width:1000px;margin:auto}
.res{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.ok{color:#2FA84F;font-weight:800}.bad{color:var(--red);font-weight:800}
.slotBtn{font:inherit;color:inherit;background:none;border:0;border-bottom:2px dotted currentColor;padding:0;cursor:pointer;letter-spacing:inherit}
</style></head>
<body>
<header>
  <img src="empwr-logo-en-tag-onyx.svg" alt="EMPWR Fitness and Sports Training">
  <div id="hdrT"><span class="ph" id="phase"></span><span class="cur" id="aim"></span></div>
  <div id="dt"></div>
</header>

<!-- STEP 1: pick members -->
<section id="stepPick">
  <div class="card hidden" id="resume"></div>
  <h1>Coach Board</h1><h2>Who Are You Logging For?</h2>
  <div class="card">
    <input id="search" placeholder="Type a member's name" autocomplete="off">
    <div id="results"></div>
    <div id="chips"></div>
    <div id="hereNote" style="font-size:13px;color:var(--mute);margin-top:8px"></div>
  </div>
  <button class="main" id="startBtn" disabled>Start Logging</button>
</section>

<!-- STEP 2: board -->
<section id="stepBoard" class="hidden">
  <h2 id="sub"></h2>
  <div class="card" style="padding:10px 14px"><input id="late" placeholder="+ Add A Name (late arrival)" autocomplete="off"><div id="lateRes"></div><div id="onChips" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px"></div><div style="font-size:13px;color:var(--mute);margin-top:6px">Tap a name to remove them from this session.</div></div>
  <div id="board"></div>
  <div id="bar"><div class="in"><button class="main" id="saveAll" style="margin:0">Save All</button><div id="autos"></div></div></div>
</section>

<!-- STEP 3: done -->
<section id="stepDone" class="hidden">
  <h1>Saved</h1><h2>Nice Work, Coach.</h2>
  <div class="card" id="done"></div>
  <button class="main" id="backBtn">‹ Back To Board (Keep Logging)</button>
  <button class="main" style="background:var(--ink)" onclick="clearDraft(); location.reload()">Log Another Group</button>
</section>

<script>
const sb = supabase.createClient("https://utljgnuieyjdqclfiwqz.supabase.co", "sb_publishable_2nvvJMGijP5Q2OKHZMphEg_fVhCMeW3", { db: { schema: 'sgpt' } });
// Class time slots: shows the class on now (from 20 min before it starts); tap the time to switch classes
const fmtSlot = s => { if (!s) return ''; const [h, m] = s.split(':').map(Number); return ((h + 11) % 12 + 1) + (m ? ':' + String(m).padStart(2, '0') : '') + (h < 12 ? 'AM' : 'PM'); };
function pickedSlot(){ try { const v = JSON.parse(localStorage.getItem('empwrSlot') || 'null'); if (v && v.until > Date.now()) return v.slot; } catch (e) {} return null; }
function pickSlot(s){ try { localStorage.setItem('empwrSlot', JSON.stringify({ slot: s, until: Date.now() + 75 * 60000 })); } catch (e) {} }
let SLOTS = [];
async function sessionRows(cols){
  const { data: all } = await sb.from('day_sessions').select('slot');
  SLOTS = [...new Set((all || []).map(r => r.slot))].sort();
  const p = pickedSlot();
  if (p && SLOTS.includes(p)) return sb.from('day_sessions').select(cols || '*').eq('slot', p).order('item_order');
  return sb.from('todays_session').select(cols || '*').order('item_order');
}
const nextSlot = cur => SLOTS.length ? SLOTS[(SLOTS.indexOf(cur) + 1) % SLOTS.length] : cur;
const slotBtn = s => SLOTS.length > 1 ? `<button class="slotBtn" title="Tap to switch class">${fmtSlot(s)} ▸</button>` : fmtSlot(s);

const $ = id => document.getElementById(id);
const show = id => ['stepPick','stepBoard','stepDone'].forEach(s => $(s).classList.toggle('hidden', s !== id));
const fmt = n => Math.round(n).toLocaleString('en-CA');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tc = x => x === x.toUpperCase() ? x.toLowerCase().replace(/(^|\s|&)(\w)/g, (m,a,b) => a + b.toUpperCase()) : x;
let picked = [], items = [], last = {};   // last[memberId][exerciseId] = [{weight,reps}...]

// ===== STEP 1 =====
let t; $('search').oninput = e => { clearTimeout(t); t = setTimeout(async () => {
  const q = e.target.value.trim(); if (q.length < 2) { $('results').innerHTML = ''; return; }
  const { data } = await sb.from('members').select('id,first_name,last_name').eq('active', true)
    .or(`first_name.ilike.%${q}%,last_name.ilike.%${q}%`).limit(8);
  $('results').innerHTML = (data || []).filter(m => !picked.some(p => p.id === m.id))
    .map(m => `<button data-id="${m.id}" data-n="${esc(m.first_name)} ${esc(m.last_name)}">${esc(m.first_name)} ${esc(m.last_name)}</button>`).join('');
}, 250); };
$('results').onclick = e => { const b = e.target.closest('button'); if (!b) return;
  picked.push({ id: b.dataset.id, name: b.dataset.n }); $('search').value = ''; $('results').innerHTML = ''; drawChips(); $('search').focus(); };
$('chips').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; picked = picked.filter(p => p.id !== b.dataset.id); drawChips(); };
function drawChips(){ $('chips').innerHTML = picked.map(p => `<button class="chip" data-id="${p.id}">${p.name}</button>`).join('');
  $('startBtn').disabled = !picked.length; $('startBtn').textContent = picked.length ? `Start Logging (${picked.length})` : 'Start Logging'; }
$('startBtn').onclick = load;
// top line like the TV: logo, phase, aim in cursive (as big as it fits), day / date / week
// session time: defaults to the session closest to now, tap to switch
let curSlot = null;
document.addEventListener('click', async e => { if (!e.target.closest('.slotBtn')) return; const nx = nextSlot(curSlot);
  if (items.length && !confirm('Switch to the ' + fmtSlot(nx) + ' class? Numbers you have not saved will be cleared.')) return;
  pickSlot(nx); const { data } = await sessionRows('title,week,slot'); if (data && data[0]) setHeader(data[0]); if (items.length) load(); });
function setHeader(r){ const t = (r.title || '').trim(), ph = (t.match(/\[\s*(phase\s*\d+)\s*\]/i) || [])[1] || '';
  $('phase').textContent = ph ? tc(ph.toUpperCase()).replace(/\s+/, ' ') : ''; $('aim').textContent = tc(t.split('--').pop().replace(/\[.*?\]/g, '').trim());
  const d = new Date(); $('dt').innerHTML = `${d.toLocaleDateString('en-CA', { weekday: 'long' })} · ${d.toLocaleDateString('en-CA', { month: 'short', day: 'numeric' }).replace(/\./g, '')} · Week ${r.week} · ${slotBtn(r.slot)}`; curSlot = r.slot;
  const a = $('aim'), box = $('hdrT'); let f = 44; a.style.fontSize = f + 'px'; while (box.scrollWidth > box.clientWidth && f > 18) { f--; a.style.fontSize = f + 'px'; } }
sessionRows('title,week,slot').then(({ data }) => { if (data && data[0]) setHeader(data[0]); });
// who's here: everyone who checked in on the iPad today shows up on their own (tap ✕ to drop a no-show)
(async () => { const d = new Date(), days = [d.toLocaleDateString('en-CA'), d.toISOString().slice(0, 10)];
  const { data: ck } = await sb.from('readiness_checkins').select('member_id').in('checkin_date', days);
  const ids = [...new Set((ck || []).map(c => c.member_id))]; if (!ids.length) return;
  const { data: ms } = await sb.from('members').select('id,first_name,last_name').in('id', ids);
  (ms || []).sort((a, b) => a.first_name.localeCompare(b.first_name)).forEach(m => { if (!picked.some(p => p.id === m.id)) picked.push({ id: m.id, name: `${m.first_name} ${m.last_name}` }); });
  $('hereNote').textContent = `${(ms || []).length} checked in on the iPad today. Add anyone else below, or tap ✕ to drop a no-show.`; drawChips(); })();

// ===== STEP 2 =====
let blocks = [];
// "A / B" in the name = they pick one. Over/under (mixed) grip = reps for each side.
// Chin-ups: weight is added lb, leave it blank for bodyweight (reps are not prefilled so nothing saves by accident)
const SIDE_RX = /\s*(SAME REPS ON EACH SIDE|EACH SIDE)\s*/ig, MIXED = /\bOVR\b|\bOVER\b|\bUNDER\b|MIXED/i, CHIN = /CHIN|PULL\s*-?\s*UP|\bOVR\s*UNDER/i;
function optsOf(it){ const raw = String((it && it.exercise) || ''); if (!/\s\/\s/.test(raw)) return null; const each = /EACH SIDE/i.test(raw);
  return raw.split(/\s+\/\s+/).map(q => { const n = q.replace(SIDE_RX, ' ').trim(), chin = CHIN.test(n) || MIXED.test(n);
    const e = LIB.find(x => x.name.trim().toUpperCase() === n.toUpperCase());
    return { name: n, label: chin && !/CHIN|PULL/i.test(n) ? 'Chin-Up ' + tc(n.replace(/\bOVR\b/i, 'OVER')) : tc(n), id: e ? e.id : null, sides: each && MIXED.test(n), bw: chin }; }); }
const modeOf = (it, oi) => { const o = optsOf(it); if (o) return o[oi || 0] || o[0]; const x = String((it && it.exercise) || '');
  return { sides: /EACH SIDE/i.test(x) && MIXED.test(x), bw: CHIN.test(x) }; };
const exIdOf = (it, oi) => { const o = optsOf(it); return (o && (o[oi || 0] || {}).id) || it.exercise_id; };
const lastTxt = (L, bw) => L ? 'Last: ' + L.map(x => `${bw ? (+x.weight ? 'BW+' + +x.weight : 'BW') : +x.weight ? +x.weight : 'BW'}×${x.reps}`).join(', ') : 'No history yet';
const noteBox = v => `<input class="cnote" placeholder="Note: anything they did differently (optional)" maxlength="160" value="${esc(v || '')}" data-cn>`;
const setBox = (s, w, r, md = {}) => `<div class="st"><span>${s}</span>${md.bw ? '<i class="bw" title="Bodyweight. Type the added weight only, if any">BW +</i>' : ''}<input type="number" inputmode="decimal" placeholder="${w || (md.bw ? '0' : 'lb')}" data-w title="${md.bw ? 'Added lb on top of bodyweight. Leave blank for bodyweight' : 'Weight (lb)'}"><i>×</i>${md.sides
  ? `<i>L</i><input type="number" inputmode="numeric" placeholder="reps" value="${r}" data-r><i>R</i><input type="number" inputmode="numeric" placeholder="reps" value="${r}" data-r2>`
  : `<input type="number" inputmode="numeric" placeholder="reps" value="${r}" data-r>`}${s > 1 ? '<i class="xs" title="Remove this set">✕</i>' : ''}</div>`;
function rowHtml(p, it, oi = 0){ const n = Math.max(1, it.sets || 3), md = modeOf(it, oi), o = optsOf(it), L = (last[p.id] || {})[exIdOf(it, oi)];
  const mx = isMax(it), W1 = (wk1[p.id] || {})[exIdOf(it, oi)];
  const w = s => { if (mx && W1) return W1; if (!L) return ''; const x = L[s] || L[L.length - 1]; return x && x.weight ? +x.weight : ''; };
  const r = md.bw ? '' : (parseInt(repsOf(it)) || '');
  const base = mx && L && L[0] ? +L[0].reps : MAX_BASE, rg = maxRange(it, base);
  const rAt = s => md.bw ? '' : !mx ? r : s < n - 1 ? ((L && (L[s] || L[L.length - 1]) || {}).reps || MAX_BASE) : '';
  const box = s => setBox(s + 1, w(s), rAt(s), md).replace(mx && s === n - 1 ? /placeholder="reps"/g : /$^/, `placeholder="${rg[0]}-${rg[1]}" data-min="${rg[0]}"`);
  return `<div class="mrow" data-m="${p.id}" data-o="${oi}"><div class="who">${esc(p.name.split(' ')[0])} ${esc(p.name.split(' ').slice(1).join(' ').slice(0,1))}.<small>${lastTxt(L, md.bw)}</small></div>
    <div>${o ? `<div class="pills opt">${o.map((x, i) => `<button data-o="${i}" class="${i === oi ? 'on' : ''}">${esc(x.label)}</button>`).join('')}</div>` : ''}<div class="sets">${Array.from({ length: n }, (_, s) => box(s)).join('')}<button class="plus" title="Add a set">+</button>${L ? '<button class="same">Same As Last</button>' : ''}<button class="fillr" title="Copy set 1 to the rest of this person's sets">Apply To All Sets ↓</button><button class="mod">✎ Modify</button></div><div class="mtot"></div>${noteBox()}</div></div>`; }
async function loadHist(memberIds){ const ids = [...new Set(items.flatMap(i => [i.exercise_id, ...(optsOf(i) || []).map(o => o.id)]).filter(Boolean))]; if (!ids.length || !memberIds.length) return;
  const { data: hist } = await sb.from('set_logs').select('member_id,exercise_id,set_number,weight,reps,workout_log_id,created_at')
    .in('member_id', memberIds).in('exercise_id', ids).order('created_at', { ascending: false }).limit(3000);
  const wlOf = {};
  (hist || []).forEach(r => { const k = r.member_id + '|' + r.exercise_id;
    if (!(k in wlOf)) wlOf[k] = r.workout_log_id;
    if (wlOf[k] === r.workout_log_id) ((last[r.member_id] ||= {})[r.exercise_id] ||= []).push(r); });
  memberIds.forEach(id => Object.values(last[id] || {}).forEach(a => a.sort((x, y) => x.set_number - y.set_number)));
  const wk = (items[0] && items[0].week) || 1, d0 = new Date(); d0.setHours(0, 0, 0, 0); d0.setDate(d0.getDate() - ((d0.getDay() + 6) % 7) - 7 * (wk - 1));
  const d1 = new Date(d0); d1.setDate(d1.getDate() + 7);
  (hist || []).forEach(r => { const t = new Date(r.created_at); if (t >= d0 && t < d1) { const o = (wk1[r.member_id] ||= {}); o[r.exercise_id] = Math.max(o[r.exercise_id] || 0, +r.weight); } }); }
// late arrival: search, then add their row under every exercise
let lt; $('late').oninput = e => { clearTimeout(lt); lt = setTimeout(async () => {
  const q = e.target.value.trim(); if (q.length < 2) { $('lateRes').innerHTML = ''; return; }
  const { data } = await sb.from('members').select('id,first_name,last_name').eq('active', true).or(`first_name.ilike.%${q}%,last_name.ilike.%${q}%`).limit(6);
  $('lateRes').innerHTML = (data || []).filter(m => !picked.some(p => p.id === m.id))
    .map(m => `<button data-id="${m.id}" data-n="${esc(m.first_name)} ${esc(m.last_name)}" style="display:block;width:100%;text-align:left;padding:10px;margin-top:6px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:600">${esc(m.first_name)} ${esc(m.last_name)}</button>`).join(''); }, 250); };
$('lateRes').onclick = async e => { const b = e.target.closest('button'); if (!b) return; const p = { id: b.dataset.id, name: b.dataset.n };
  picked.push(p); $('late').value = ''; $('lateRes').innerHTML = ''; await loadHist([p.id]);
  document.querySelectorAll('.ex').forEach(card => { const it = items[+card.dataset.idx]; card.insertAdjacentHTML('beforeend', isCardio(it) ? cardioRow(p, it) : rowHtml(p, it)); });
  drawOn(); totals(); };
// remove someone from the board (no-show, left early, added by mistake)

// ===== MODIFY (tool, swap, reps, why) =====

// rebuild one member's row for the swap / new rep scheme, and tag it so the coach sees it at a glance

      if (md) { const alt = md.alt && LIB.find(e => e.id === md.alt);
        (P.mods ||= []).push({ exercise_id: it.exercise_id, exercise: it.exercise, swapped_to_id: md.alt || null, swapped_to: alt ? alt.name : null,
          tool: md.tool || null, sets: md.sets, reps: md.reps, reason: md.why || null, note: md.note || null });
        // same format as the iPad setup note, so the member sees it next time they do this lift
        const nt = [md.tool, md.note].filter(Boolean).join(' · ');
        if (nt && exId) (P.notes ||= []).push({ exercise_id: exId, exercise: alt ? alt.name : it.exercise, note: nt }); } }); });
  // coach notes per person per exercise (kept apart from the member's setup notes)
  document.querySelectorAll('.ex').forEach(card => { const it = items[+card.dataset.idx]; card.querySelectorAll('.mrow').forEach(r => { const v = ((r.querySelector('[data-cn]') || {}).value || '').trim(); if (!v || !per[r.dataset.m]) return;
    const alt = r._mod && r._mod.alt && LIB.find(e => e.id === r._mod.alt), opt = (optsOf(it) || [])[+r.dataset.o || 0];
    (per[r.dataset.m].cn ||= []).push({ exercise_id: (alt && alt.id) || exIdOf(it, +r.dataset.o || 0), exercise: alt ? alt.name : opt ? opt.label : it.exercise, note: v }); }); });
  // save again any time: new sets get added to the same workout, changed ones get updated, nothing doubles up
  const sig = x => `${x.weight}|${x.reps}`;
  const isNew = p => !WL[p.id] || per[p.id].sets.some(x => !x.st.dataset.sid || x.st.dataset.sv !== sig(x)) || per[p.id].cardio.length || (per[p.id].cn || []).length || (per[p.id].mods || []).length;
  const todo = picked.filter(p => (per[p.id].sets.length || per[p.id].cardio.length || (per[p.id].cn || []).length || (per[p.id].mods || []).length) && isNew(p));
  if (!todo.length) { alert(Object.keys(WL).length ? 'Everything is already saved.' : 'Nothing to save yet. Enter at least one set.'); return; }
  if (!confirm(`Save for ${todo.map(p => p.name.split(' ')[0]).join(', ')}?`)) return;
  $('saveAll').disabled = true; $('saveAll').textContent = 'Saving...';
  const out = [];
  for (const p of todo) { const P = per[p.id];
    const notes = JSON.stringify({ source: 'coach board', session_time: fmtSlot(curSlot), cardio: P.cardio, coach_notes: P.cn || [], mods: P.mods || [], notes: P.notes || [], choices: P.choices || [], sides: P.sides || [] });
    if (!WL[p.id]) { const { data: wl, error } = await sb.from('workout_logs').insert({ member_id: p.id, session_id: items[0].session_id, entered_by: 'coach', notes }).select().single();
      if (error) { out.push(`<div class="res"><span>${p.name}</span><span class="bad">Not saved, try again</span></div>`); continue; } WL[p.id] = wl.id; }
    else await sb.from('workout_logs').update({ notes }).eq('id', WL[p.id]);
    const fresh = P.sets.filter(x => !x.st.dataset.sid), changed = P.sets.filter(x => x.st.dataset.sid && x.st.dataset.sv !== sig(x));
    let bad = 0;
    if (fresh.length) { const { data: ins, error: e2 } = await sb.from('set_logs').insert(fresh.map(({ st, ...x }) => ({ ...x, workout_log_id: WL[p.id], member_id: p.id }))).select('id');
      if (e2) bad += fresh.length; else fresh.forEach((x, i) => { x.st.dataset.sid = ((ins || [])[i] || {}).id || ''; x.st.dataset.sv = sig(x); x.st.classList.add('saved'); }); }
    for (const x of changed) { const { error: e3 } = await sb.from('set_logs').update({ weight: x.weight, reps: x.reps, set_number: x.set_number }).eq('id', x.st.dataset.sid);
      if (e3) bad++; else x.st.dataset.sv = sig(x); }
    out.push(`<div class="res"><span>${p.name}</span><span class="${bad ? 'bad' : 'ok'}">${bad ? `${bad} set${bad > 1 ? 's' : ''} not saved, try again` : `✓ ${P.lb ? fmt(P.lb) + ' lb moved' : 'Saved'}${P.cardio.length ? ' + cardio' : ''}${(P.mods || []).length ? ` · ${P.mods.length} modified` : ''}`}</span></div>`);
  }
  saveDraft(true); $('saveAll').disabled = false; $('saveAll').textContent = 'Save All';
  $('done').innerHTML = out.join(''); show('stepDone'); scrollTo(0, 0);
};
$('backBtn').onclick = () => { show('stepBoard'); scrollTo(0, 0); };

// ===== AUTOSAVE (this iPad / laptop) =====
// every number typed is kept on this device for the day, so a reload, a dead battery or an early Save never loses the board
let WL = {}, draftT = null, restoring = false;
const DKEY = 'empwrCoachDraft', today = () => new Date().toLocaleDateString('en-CA');
function clearDraft(){ try { localStorage.removeItem(DKEY); } catch (e) {} }
function saveDraft(now){ if (restoring || !items.length) return; clearTimeout(draftT); const go = () => {
  const rows = {}, crows = {};
  document.querySelectorAll('.ex').forEach(card => { const idx = card.dataset.idx;
    card.querySelectorAll('.mrow:not(.crow)').forEach(r => { rows[idx + '|' + r.dataset.m] = { o: +r.dataset.o || 0, mod: r._mod || null, cn: (r.querySelector('[data-cn]') || {}).value || '',
      sets: [...r.querySelectorAll('.st')].map(st => [(st.querySelector('[data-w]') || {}).value || '', (st.querySelector('[data-r]') || {}).value || '', (st.querySelector('[data-r2]') || {}).value || '', st.dataset.sid || '', st.dataset.sv || '']) }; });
    card.querySelectorAll('.crow').forEach(r => { const o = {}; r.querySelectorAll('[data-c]').forEach(f => o[f.dataset.c] = f.value); o.cn = (r.querySelector('[data-cn]') || {}).value || ''; crows[idx + '|' + r.dataset.m] = o; }); });
  try { localStorage.setItem(DKEY, JSON.stringify({ day: today(), slot: curSlot, picked, wl: WL, rows, crows, t: Date.now() })); } catch (e) {}
  $('autos').textContent = `Autosaved on this device ${new Date().toLocaleTimeString('en-CA', { hour: 'numeric', minute: '2-digit' })}`; };
  now ? go() : (draftT = setTimeout(go, 400)); }
$('board').addEventListener('input', () => saveDraft());
$('board').addEventListener('change', () => saveDraft());
$('board').addEventListener('click', () => setTimeout(saveDraft, 50));
$('onChips').addEventListener('click', () => setTimeout(saveDraft, 50));

async function applyDraft(d){ restoring = true; WL = d.wl || {};
  for (const [k, v] of Object.entries(d.rows || {})) { const [idx, mid] = k.split('|'), it = items[+idx], p = picked.find(x => x.id === mid);
    let row = document.querySelector(`.ex[data-idx="${idx}"] .mrow[data-m="${mid}"]`); if (!row || !p || !it) continue;
    if ((+row.dataset.o || 0) !== v.o) { const t = document.createElement('div'); t.innerHTML = rowHtml(p, it, v.o); row.replaceWith(t.firstElementChild); row = document.querySelector(`.ex[data-idx="${idx}"] .mrow[data-m="${mid}"]`); }
    if (v.mod) { row._mod = v.mod; await applyMod(row); }
    const sets = row.querySelector('.sets'); let st = sets.querySelectorAll('.st');
    while (st.length < v.sets.length) { sets.querySelector('.plus').click(); st = sets.querySelectorAll('.st'); }
    for (let i = st.length - 1; i >= v.sets.length && i > 0; i--) st[i].remove();
    sets.querySelectorAll('.st').forEach((x, i) => { const [w, r, r2, sid, sv] = v.sets[i] || []; const W = x.querySelector('[data-w]'), R = x.querySelector('[data-r]'), R2 = x.querySelector('[data-r2]');
      if (W) W.value = w || ''; if (R) R.value = r || ''; if (R2) R2.value = r2 || ''; x.querySelector('span').textContent = i + 1;
      if (sid) { x.dataset.sid = sid; x.dataset.sv = sv; x.classList.add('saved'); } });
    if (v.cn) row.querySelector('[data-cn]').value = v.cn; }
  for (const [k, v] of Object.entries(d.crows || {})) { const [idx, mid] = k.split('|'), r = document.querySelector(`.ex[data-idx="${idx}"] .crow[data-m="${mid}"]`); if (!r) continue;
    if (v.cn) r.querySelector('[data-cn]').value = v.cn;
    r.querySelectorAll('[data-c]').forEach(f => { if (v[f.dataset.c] != null && v[f.dataset.c] !== '') f.value = v[f.dataset.c]; }); }
  restoring = false; totals(); }
// offer to pick up where you left off (same day)
(() => { let d; try { d = JSON.parse(localStorage.getItem(DKEY) || 'null'); } catch (e) {} if (!d || d.day !== today() || !(d.picked || []).length) return;
  const el = $('resume'); el.classList.remove('hidden');
  el.innerHTML = `<b>Unfinished Board: ${fmtSlot(d.slot) || 'Today'}</b><div style="font-size:13px;margin:4px 0 10px">${d.picked.map(p => esc(p.name.split(' ')[0])).join(', ')} · last change ${new Date(d.t).toLocaleTimeString('en-CA', { hour: 'numeric', minute: '2-digit' })}</div>
    <button class="main" id="resumeBtn" style="margin:0">Pick Up Where I Left Off</button><button id="discardBtn" style="border:0;background:none;color:var(--mute);margin-top:8px;width:100%">Start Fresh Instead</button>`;
  $('discardBtn').onclick = () => { clearDraft(); el.classList.add('hidden'); };
  $('resumeBtn').onclick = async () => { if (d.slot) pickSlot(d.slot); picked = d.picked; el.innerHTML = 'Loading...'; await load(); await applyDraft(d); el.classList.add('hidden'); saveDraft(true); }; })();
</script>
