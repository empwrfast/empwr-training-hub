<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMPWR Today's Lift</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Mr+Dafoe&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--onyx:#12161F;--red:#EB5345;--wht:#FFFFFF;--bg:var(--wht);--fg:var(--onyx);--card:#F3F4F6}
body.dark{--bg:var(--onyx);--fg:var(--wht);--card:#1C2230}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Montserrat,sans-serif;height:100vh;display:flex;flex-direction:column;padding:2.5vh 3vw}
header{display:flex;justify-content:space-between;align-items:center}
header img{height:9vh}
body.dark .logo-onyx,body:not(.dark) .logo-white{display:none}
#toggle{background:none;border:2px solid var(--fg);color:var(--fg);border-radius:50%;width:5vh;height:5vh;font-size:2.4vh;cursor:pointer}
.title{text-align:center;margin:2vh 0}
.title h1{font-family:'Bebas Neue';font-size:9vh;letter-spacing:.05em;line-height:1}
.title h2{font-family:'Mr Dafoe';color:var(--red);font-size:6vh;margin-top:-2vh}
main{flex:1;display:grid;grid-template-columns:1fr 26vw;gap:3vw;min-height:0}
#lifts{display:flex;flex-direction:column;gap:1.6vh;overflow:hidden}
.lift{background:var(--card);border-left:1vh solid var(--red);border-radius:1.2vh;padding:1.8vh 2vw;display:grid;grid-template-columns:6vw 1fr auto;align-items:center}
.lift .n{font-family:'Bebas Neue';font-size:7vh;color:var(--red)}
.lift .ex{font-family:'Bebas Neue';font-size:5.5vh;letter-spacing:.03em}
.lift .meta{font-size:2.2vh;opacity:.75;margin-top:.4vh}
.lift .scheme{font-family:'Bebas Neue';font-size:6vh}
aside{display:flex;flex-direction:column;gap:2vh}
.box{background:var(--card);border-radius:1.2vh;padding:2vh;text-align:center}
.box h3{font-family:'Bebas Neue';font-size:4vh;letter-spacing:.05em}
#qr{background:#fff;padding:1.5vh;border-radius:1vh;display:inline-block;margin:1.5vh 0}
.big{font-family:'Bebas Neue';font-size:12vh;color:var(--red);line-height:1}
#feed{text-align:left;font-size:2vh;line-height:1.7}
footer{display:flex;justify-content:flex-end;padding-top:1vh}
footer img{height:7vh}
#feed{max-height:18vh;overflow:hidden}
.empty{font-size:3vh;opacity:.7;text-align:center;margin-top:10vh}

/* ===== v2: header line, block banner, paged blocks ===== */
.title{display:none}
header{gap:1.4vw}
#hdrT{flex:1;display:flex;align-items:center;gap:1.2vw;min-width:0;font-family:'Bebas Neue';letter-spacing:.04em}
#hdrT .tl{flex:1;min-width:0;overflow:hidden;display:flex;align-items:center;gap:.8vw;line-height:1}
#hdrT .ph{font-size:3.6vh;white-space:nowrap}
.cur{font-family:'Mr Dafoe';color:var(--red);text-transform:none;letter-spacing:0;white-space:nowrap}
#hdrR{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;line-height:1}
#tclk{font-size:6vh;color:var(--red)}
#hdrR .dt{font-size:2.2vh;opacity:.7;white-space:nowrap}
#toggle{display:none}
main{margin-top:1.5vh}
#lifts{display:flex;flex-direction:column;gap:1.3vh;overflow:hidden}
#band{display:flex;justify-content:space-between;align-items:center;background:var(--red);color:#fff;border-radius:1vh;padding:.8vh 1.6vw;margin-bottom:.4vh}
#band .l{display:flex;align-items:baseline;gap:1.4vw}
#band .nm{font-family:'Bebas Neue';font-size:4.6vh;line-height:1;letter-spacing:.04em}
#band .q{font-family:'Mr Dafoe';font-size:3.8vh;line-height:1}
#band .tm{font-family:'Bebas Neue';font-size:2.6vh;letter-spacing:.06em}
.lift{padding:1.6vh 1.4vw;grid-template-columns:5.5vw 1fr auto}
.lift>div:nth-child(2){min-width:0}
.lift .n{font-size:4.6vh}
.lift .ex{white-space:nowrap;overflow:hidden;line-height:1.05}
.lift .note{font-size:2.2vh;color:var(--red);font-weight:700;margin-top:.3vh}
.lift .scheme{font-size:4.2vh;margin-left:1.2vw;white-space:nowrap}
#navrow{display:flex;justify-content:center;align-items:center;gap:1.2vw;margin-top:auto;padding-top:.6vh}
#navrow .dot{width:1.6vh;height:1.6vh;border-radius:50%;background:var(--fg);opacity:.2;cursor:pointer}
#navrow .dot.on{opacity:1;background:var(--red);width:4vh;border-radius:1vh}
#navrow .nb{width:4.6vh;height:4.6vh;border-radius:50%;border:2px solid var(--fg);background:none;color:var(--fg);font:600 2.6vh Montserrat;line-height:1;cursor:pointer;opacity:.5}
/* v3: letter groups + choose one */
.lift.gap,.choose.gap{margin-top:3.5vh}
.choose{border:.4vh dashed var(--red);border-radius:1.4vh;padding:.8vh .8vw 1vh;display:flex;flex-direction:column;gap:.5vh}
.chz{font-family:'Bebas Neue';color:var(--red);font-size:3vh;letter-spacing:.08em;line-height:1}
.or{font-family:'Mr Dafoe';color:var(--red);font-size:3.6vh;text-align:center;line-height:.9}
/* long pages (warm-up) go two columns */
#lifts.many{display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:1vh 1vw}
#lifts.many #band,#lifts.many #navrow{grid-column:1/-1}
#lifts.many .lift{padding:.9vh 1vw}
#lifts.many .lift .scheme{font-size:3.2vh}
</style></head>
<body>
<header>
  <img class="logo-onyx" src="empwr-logo-en-tag-onyx.svg" alt="EMPWR Fitness and Sports Training">
  <img class="logo-white" src="empwr-logo-en-tag-white.svg" alt="EMPWR Fitness and Sports Training">
  <div id="hdrT"><div class="tl"><span class="ph" id="phase"></span><span class="cur" id="aim"></span></div><div id="hdrR"><span id="tclk"></span><span class="dt" id="dt"></span></div></div>
  <button id="toggle" title="Theme">☀️</button>
</header>
<div class="title"><h1 id="sessTitle">Today's Lift</h1><h2 id="sessSub"></h2></div>
<main>
  <section id="lifts"><div class="empty">Loading today's session...</div></section>
  <aside>
    <div class="box"><h3>Log Your Lift</h3>
      <div style="font-size:2vh">Open the EMPWR app, or scan</div>
      <div id="qr"></div></div>
    <div class="box"><h3>Logged Today</h3><div class="big" id="count">0</div></div>
    <div class="box"><h3>New PRs</h3><div id="feed">No PRs yet. Go get one.</div></div>
  </aside>
</main>
<footer><img src="pitter-patter-red.svg" alt="Pitter Patter Make It Matter"></footer>
<script>
// ===== CONFIG: paste from Supabase > Project Settings > API =====
const SUPABASE_URL = "https://utljgnuieyjdqclfiwqz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_2nvvJMGijP5Q2OKHZMphEg_fVhCMeW3";
const APP_URL = "https://empwrfast.github.io/empwr-training-hub/log.html";
// ================================================================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { db: { schema: 'sgpt' } });
const t = document.getElementById('toggle');
t.onclick = () => { document.body.classList.toggle('dark');
  t.textContent = document.body.classList.contains('dark') ? '🌙' : '☀️'; };

// Section quality + time come from the sheet. Labels (A1, i, ...) are stored in "tempo",
// the section's time window (e.g. "22-38") in "rest" by the sheet sync.
const pad = n => String(n).padStart(2,'0');
const titleCase = s => s === s.toUpperCase() ? s.toLowerCase().replace(/(^|\s|&)(\w)/g,(m,a,b)=>a+b.toUpperCase()) : s;
const scheme = r => { const reps = String(r.reps||'').split('|').pop().trim();
  return r.sets ? (reps ? `${r.sets} x ${reps}` : `${r.sets} set${r.sets>1?'s':''}`) : reps; };
let pages = [], pageIdx = 0, sessionId = null;

function setHeader(s){
  const t = (s.title||'').trim();
  const ph = (t.match(/\[\s*(phase\s*\d+)\s*\]/i)||[])[1] || '';
  const aim = t.split('--').pop().replace(/\[.*?\]/g,'').trim();
  document.getElementById('phase').textContent = ph ? titleCase(ph.replace(/\s+/,' ')) : '';
  document.getElementById('aim').textContent = titleCase(aim);
  const d = new Date();
  const dayName = d.toLocaleDateString('en-CA',{weekday:'long'});
  const md = d.toLocaleDateString('en-CA',{month:'short',day:'numeric'}).replace(/\./g,'');
  document.getElementById('dt').textContent = `${dayName} · ${md} · Week ${s.week}`;
  fitAim();
}
function fitAim(){
  const t = document.querySelector('#hdrT .tl'), a = document.getElementById('aim');
  let f = 20; a.style.fontSize = f+'px';
  while (t.scrollWidth <= t.clientWidth && f < innerHeight*0.1){ f++; a.style.fontSize = f+'px'; }
  if (t.scrollWidth > t.clientWidth) a.style.fontSize = (f-1)+'px';
}
function fitNames(){
  document.querySelectorAll('.lift .ex').forEach(e=>{
    let f = innerHeight*0.046; e.style.fontSize = f+'px';
    while (e.scrollWidth > e.clientWidth && f > 14){ f--; e.style.fontSize = f+'px'; }
  });
}

// Same label twice in a row (B1 / B1) = choose one. New letter (B > C) = extra space.
const letterOf = r => ((r.tempo||'').match(/^[A-Z]/i)||[''])[0].toUpperCase();
function groupHtml(list, card){
  let html = '', prev = null;
  for (let k = 0; k < list.length; k++){
    const r = list[k], lbl = r.tempo || '', L = letterOf(r);
    const gap = prev !== null && L && L !== prev; prev = L || prev;
    if (lbl && list[k+1] && list[k+1].tempo === lbl){
      const grp = [r]; while (list[k+1] && list[k+1].tempo === lbl){ grp.push(list[++k]); }
      html += `<div class="choose${gap?' gap':''}"><div class="chz">Choose 1</div>${grp.map(x=>card(x,false)).join('<div class="or">or</div>')}</div>`;
    } else html += card(r, gap);
  }
  return html;
}
// Blank sets/reps = same as the exercise before it in the block
function fillReps(list){
  list.forEach((r,i)=>{ const reps = String(r.reps||'').split('|').pop().trim();
    if (r.tempo && !r.sets && !reps && i > 0){ r.sets = list[i-1].sets; r.reps = list[i-1].reps; } });
}
function draw(){
  const el = document.getElementById('lifts');
  if (!pages.length){ el.innerHTML = '<div class="empty">No session programmed for today.</div>'; return; }
  if (pageIdx >= pages.length) pageIdx = 0;
  const pg = pages[pageIdx];
  el.classList.toggle('many', pg.items.length > 6);
  el.innerHTML =
    `<div id="band"><div class="l"><span class="nm">${pg.nm}</span><span class="q">${pg.q}</span></div>`+
    `<span class="tm">${pg.tm ? pg.tm+' min' : ''}</span></div>`+
    groupHtml(pg.items, (r,gap)=>`<div class="lift${gap?' gap':''}"><div class="n">${r.tempo||''}</div>
      <div><div class="ex">${r.exercise}</div></div>
      <div class="scheme">${scheme(r)}</div></div>`)+
    `<div id="navrow"><button class="nb" data-d="-1">‹</button>${pages.map((_,j)=>`<span class="dot${j===pageIdx?' on':''}" data-j="${j}"></span>`).join('')}<button class="nb" data-d="1">›</button></div>`;
  el.querySelectorAll('.dot').forEach(d=>d.onclick=()=>{ pageIdx = +d.dataset.j; draw(); });
  el.querySelectorAll('.nb').forEach(b=>b.onclick=()=>go(+b.dataset.d));
  fitNames();
}
function go(dir){ if(!pages.length) return; pageIdx = (pageIdx + dir + pages.length) % pages.length; draw(); }
document.addEventListener('keydown', e=>{
  if (e.key==='ArrowRight' || e.key===' ') go(1);
  if (e.key==='ArrowLeft') go(-1);
});
addEventListener('resize', ()=>{ fitAim(); fitNames(); });
setInterval(()=>{ const d=new Date(); document.getElementById('tclk').textContent = `${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }, 1000);

async function loadSession(){
  const { data, error } = await sb.from('todays_session').select('*');
  if (error || !data || !data.length){ pages = []; draw(); return null; }
  setHeader(data[0]);
  pages = []; let cur = null;
  data.forEach(r=>{
    const raw = (r.intensity||'').replace(/\s+/g,' ').trim();
    const nm = raw.replace(/\[.*?\]/g,'').trim().split(' ')[0] || 'Today';
    let q = (raw.match(/\[(.*?)\]/)||[])[1] || raw.replace(/\[.*?\]/g,'').trim().split(' ').slice(1).join(' ');
    if (nm.includes('☠')) q = 'Choose 🤗 1';
    if (!cur || cur.raw !== raw){ cur = { raw, nm, q: titleCase(q), tm: r.rest || '', items: [] }; pages.push(cur); }
    cur.items.push(r);
  });
  pages.forEach(pg=>fillReps(pg.items));
  draw();
  return data[0].session_id;
}
async function loadStats(){
  const today = new Date().toISOString().slice(0,10);
  const { count } = await sb.from('workout_logs').select('id',{count:'exact',head:true}).eq('log_date', today);
  document.getElementById('count').textContent = count || 0;
  const { data } = await sb.from('personal_records')
    .select('value,pr_type,members(first_name),exercises(name)')
    .eq('achieved_on', today).eq('pr_type','heaviest').limit(6);
  if (data && data.length) document.getElementById('feed').innerHTML =
    data.map(p=>`🔥 <b>${p.members.first_name}</b>, ${p.exercises.name} ${p.value}`).join('<br>');
}
(async()=>{
  const sid = await loadSession();
  new QRCode(document.getElementById('qr'), {text:`${APP_URL}?log=${sid||''}`, width:220, height:220});
  loadStats();
  sb.channel('floor').on('postgres_changes',{event:'INSERT',schema:'public',table:'set_logs'},loadStats)
    .on('postgres_changes',{event:'*',schema:'public',table:'personal_records'},loadStats).subscribe();
  setInterval(()=>{ loadSession(); loadStats(); }, 5*60*1000);
})();
</script></body></html>
