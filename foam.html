<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMPWR Foam Roll + Stretch</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Mr+Dafoe&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--onyx:#12161F;--red:#EB5345;--card:#F3F4F6}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#fff;color:var(--onyx);font-family:Montserrat,sans-serif;overflow:hidden}
#foam{height:100vh;display:none;flex-direction:column;padding:2vh 2.4vw;gap:1.4vh}
header{display:flex;align-items:center;gap:1.4vw}
header img{height:8vh}
header .t{font-family:'Bebas Neue';font-size:6.5vh;letter-spacing:.04em;line-height:1}
header .s{font-family:'Mr Dafoe';color:var(--red);font-size:4.4vh;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
header .cd{margin-left:auto;text-align:right;font-family:'Bebas Neue';line-height:1}
header .cd small{display:block;font-size:2.2vh;letter-spacing:.06em;opacity:.7}
header .cd b{font-size:6.5vh;color:var(--red);font-weight:400}
#grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:1fr 1fr;gap:1.4vh 1.2vw}
.tile{grid-column:span 2;display:flex;flex-direction:column;min-height:0;background:var(--card);border-radius:1.2vh;overflow:hidden}
.tile:nth-child(4){grid-column:2 / span 2}
.tile:nth-child(5){grid-column:4 / span 2}
.lbl{display:flex;align-items:center;gap:.8vw;padding:.6vh 1vw;font-family:'Bebas Neue';font-size:3.6vh;letter-spacing:.05em}
.lbl b{background:var(--red);color:#fff;border-radius:50%;width:4.6vh;height:4.6vh;display:grid;place-items:center;font-weight:400;flex:none}
.vw{flex:1;min-height:0;background:#000}
.vw iframe{width:100%;height:100%;border:0;display:block}
#grid.one{grid-template-rows:1fr}
#grid.one .tile{grid-column:span 2}
.novid{height:100%;display:grid;place-items:center;color:#fff;font-family:'Bebas Neue';font-size:7vh;letter-spacing:.05em}
.stp{background:var(--red);color:#fff;border-radius:1vh;padding:.2vh 1vw;margin-right:1vw;font-size:4.4vh;vertical-align:middle}
.nt{background:var(--onyx);color:#fff;border-radius:1vh;padding:.3vh 1vw;margin-left:1vw;font-size:3.4vh;vertical-align:middle;letter-spacing:.06em}
#grid.solo{grid-template-columns:1fr;grid-template-rows:1fr}
#grid.solo .tile{grid-column:1 / -1;width:min(100%,60vh);justify-self:center}
/* no YouTube controls: cover + crop the player */
.vw{position:relative;overflow:hidden}
.vw iframe{transform:scale(1.22);transform-origin:center}
.vw::after{content:'';position:absolute;inset:0;z-index:2}
/* see-through labels over the video so the whole drill shows */
.tile{position:relative}
.lbl{position:absolute;top:0;left:0;right:0;z-index:3;background:rgba(18,22,31,.45)!important}
.tile.after .lbl{background:rgba(235,83,69,.6)!important}
.vw iframe{transform:scale(1.1)!important}
/* 6 tiles: 3 + 3, and the after-foam-roll drill outlined in red */
#grid.six .tile:nth-child(n){grid-column:span 2}
.tile.after{outline:.6vh solid var(--red);outline-offset:-.6vh}
.tile.after .lbl{background:var(--red);font-size:3vh;line-height:1.1}
.tile.after .lbl b{background:#fff;color:var(--red)}
/* big labels above each video, fits any TV */
header{flex-wrap:nowrap;min-width:0}
header .t{white-space:nowrap;font-size:6vh}
.lbl{font-size:5vh;padding:.8vh 1.2vw;background:var(--onyx);color:#fff;gap:1vw}
.lbl b{width:5.6vh;height:5.6vh;font-size:4vh}
#grid{gap:1.6vh 1.2vw}
#idle{position:fixed;inset:0;border:0;width:100%;height:100%;display:none}
</style></head>
<body>
<section id="foam">
  <header>
    <img src="empwr-logo-en-tag-onyx.svg" alt="EMPWR Fitness and Sports Training">
    <span class="t" id="pt">Foam Roll</span><span class="s" id="ps"></span>
    <div class="cd" id="cdbox"><small id="cdl">Session starts in</small><b id="cd">10:00</b></div>
  </header>
  <div id="grid"></div>
</section>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
// Videos from the EMPWR Exercise Video Library / Rich's channel
const SCREENS = {
  foam:  { step: 'Step 1', title: 'Foam Roll', note: 'When Done Foam Rolling, #6 →',
           vids: [['Glutes','dqq7NiCjcO4'],['Calves','Z9Bzmqm8HXQ'],['Quads','r-P6UQabO0k'],['Groin','JR3xEW2Pr9M'],['Lats','kZna7n_WL1A'],['When Done Foam Rolling: Elbow To Instep + T-Spine With Foot On Wall','7CU2rovveHM','after']] },
  hip:   { step: 'Step 2', title: 'Hip Flexor Stretch', note: 'After Foam Roll',
           vids: [['1/2 Kneeling Hip Flexor, Wall + Reach','7CU2rovveHM']] },
  cool:  { step: 'Cooldown', title: 'Stretch', note: 'End Of Session',
           vids: [['Chest with Breathing','L4ofq3j4ZDc'],['Lat Hang','LRGdq9KSwJs'],['1/2 Kneeling RF/Hip Flexor Stretch','2HJ52_sVh_g']] }
};
const P = new URLSearchParams(location.search);
// Session start times (24h). Change with ?times=7:00,8:00,17:00
const TIMES = (P.get('times') || '7:00,8:00,11:30,12:30,17:00,18:00').split(',')
  .map(t => { const [h,m] = t.trim().split(':').map(Number); return h*60 + (m||0); }).sort((x,y)=>x-y);
// Timeline around each session start (minutes)
const FOAM_BEFORE = 10, HIP_AFTER = 5, COOL_FROM = 50, LEN = 60;
const pad = n => String(Math.floor(n)).padStart(2,'0');
const embed = id => `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&loop=1&playlist=${id}&controls=0&rel=0&playsinline=1&modestbranding=1`;
let shown = null;

// What should be on screen right now
function now(){
  const d = new Date(), m = d.getHours()*60 + d.getMinutes() + d.getSeconds()/60;
  for (const t of TIMES){
    const next = TIMES.find(x => x > t);
    const backToBack = next !== undefined && next - t <= LEN;
    const coolEnd = backToBack ? next - 5 : t + LEN;           // leave 5 min of foam roll for the next group
    if (m >= t && m < t + HIP_AFTER) return { key:'foam', t, m };   // hip flexor is tile 6 on the foam screen
    if (m >= t + COOL_FROM && m < coolEnd) return { key:'cool', t, m };
  }
  for (const t of TIMES) if (m >= t - FOAM_BEFORE && m < t) return { key:'foam', t, m };
  return { key:'foam', t:null, m };                             // all day: foam roll
}
function draw(key){
  const pg = SCREENS[key];
  document.getElementById('pt').innerHTML = `<span class="stp">${pg.step}</span>${pg.title}<span class="nt">${pg.note}</span>`;
  document.getElementById('ps').textContent = pg.vids.length > 1 ? pg.vids.map(v=>v[0]).join(' → ') : '';
  const g = document.getElementById('grid');
  g.innerHTML = pg.vids.map((v,i)=>
    `<div class="tile${v[2]?' after':''}"><div class="lbl"><b>${i+1}</b>${v[0]}</div><div class="vw">${v[1] ? `<div class="yt" data-id="${v[1]}"></div>` : `<div class="novid">${v[0]}</div>`}</div></div>`).join('');
  g.className = pg.vids.length === 1 ? 'solo' : pg.vids.length <= 3 ? 'one' : pg.vids.length === 6 ? 'six' : '';
  shown = key;
  mountPlayers();
}
// YouTube players: muted, slowed down, restart just before the end so no pause/end screen shows
const RATE = +(P.get('speed') || 0.75);
// Stop before the outro card (seconds)
const ENDS = { '7CU2rovveHM': 37.3 };
let players = [];
function mountPlayers(){
  players.forEach(p => { try { p.destroy(); } catch(e){} }); players = [];
  if (!(window.YT && YT.Player)) { window.onYouTubeIframeAPIReady = mountPlayers; return; }
  document.querySelectorAll('.yt').forEach(el => {
    const pl = new YT.Player(el, { videoId: el.dataset.id,
      playerVars: { autoplay:1, mute:1, controls:0, rel:0, playsinline:1, modestbranding:1, disablekb:1, fs:0, iv_load_policy:3 },
      events: {
        onReady: e => { e.target.mute(); e.target.setPlaybackRate(RATE); e.target.playVideo(); },
        onStateChange: e => { if (e.data === YT.PlayerState.ENDED || e.data === YT.PlayerState.PAUSED) { e.target.seekTo(0, true); e.target.playVideo(); } }
      } });
    pl.__end = ENDS[el.dataset.id]; players.push(pl);
  });
}
setInterval(() => players.forEach(p => { try {
  const d = p.getDuration(), t = p.getCurrentTime();
  if (d && t > (p.__end || d - 0.8)) p.seekTo(0, true);
  if (p.getPlaybackRate && p.getPlaybackRate() !== RATE) p.setPlaybackRate(RATE);
} catch(e){} }), 300);
function tick(){
  const s = now();
  if (s.key !== shown) draw(s.key);
  const box = document.getElementById('cdbox');
  if (s.t !== null && (s.key === 'foam' || s.key === 'hip')){
    const diff = (s.t - s.m) * 60, x = Math.abs(diff);
    box.style.visibility = 'visible';
    document.getElementById('cdl').textContent = diff > 0 ? 'Session starts in' : 'Session started';
    document.getElementById('cd').textContent = `${pad(x/60)}:${pad(x%60)}`;
  } else box.style.visibility = 'hidden';
}
document.getElementById('foam').style.display = 'flex';
tick(); setInterval(tick, 1000);
</script></body></html>
