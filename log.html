<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMPWR Log Your Lift</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Mr+Dafoe&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#12161F;--onyx:#12161F;--red:#EB5345;--wht:#FFFFFF;--bg:var(--wht);--fg:var(--onyx);--card:#F3F4F6;--line:#D9DCE1}
body.dark{--ink:#2C3446;--bg:var(--onyx);--fg:var(--wht);--card:#1C2230;--line:#2C3446}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Montserrat,sans-serif;max-width:640px;margin:auto;padding:16px 16px 90px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
header img{height:44px}
body.dark .logo-onyx,body:not(.dark) .logo-white{display:none}
#toggle{background:none;border:2px solid var(--fg);color:var(--fg);border-radius:50%;width:38px;height:38px;cursor:pointer}
h1{font-family:'Bebas Neue';font-size:40px;letter-spacing:.04em;line-height:1}
h2{font-family:'Mr Dafoe';font-weight:400;color:var(--fg);font-size:34px;letter-spacing:.02em;margin:-6px 0 10px}
h3{font-family:'Bebas Neue';font-size:24px;letter-spacing:.04em}
.card{background:var(--card);border-radius:12px;padding:14px;margin:12px 0}
input,select{font:inherit;width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button.main{font-family:'Bebas Neue';font-size:24px;letter-spacing:.05em;width:100%;padding:12px;border:0;border-radius:10px;background:var(--red);color:#fff;cursor:pointer;margin-top:10px}
.hidden{display:none}
.scale{display:flex;gap:6px;margin:6px 0 12px}
.ds{display:flex;gap:6px;font-family:inherit}.ds button{font-family:'Bebas Neue';font-size:18px;letter-spacing:.05em;padding:6px 14px;border-radius:8px;border:2px solid #fff;background:transparent;color:#fff;cursor:pointer}
.ds button[data-s=done].on{background:#2FA84F;border-color:#2FA84F}.ds button[data-s=skip].on{background:#8a8f98;border-color:#8a8f98}
.lbls{display:flex;gap:6px;margin:4px 0 -2px}.lbls span{flex:1;text-align:center;font-size:12px;font-weight:800;line-height:1.1}
.scale button{flex:1;padding:10px 0;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-weight:800;cursor:pointer}
.scale button.on{background:var(--red);color:#fff;border-color:var(--red)}
.scale button[data-v="1"]{--c:#E5484D}.scale button[data-v="2"]{--c:#F07A3C}.scale button[data-v="3"]{--c:#E8B32E}.scale button[data-v="4"]{--c:#8DBF3F}.scale button[data-v="5"]{--c:#2FA84F}
.scale button{background:color-mix(in srgb,var(--c) 12%,var(--bg));border-color:color-mix(in srgb,var(--c) 45%,var(--bg))}
.scale button.on{background:var(--c);border-color:var(--c);color:#fff}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-family:'Bebas Neue';font-size:22px;color:#fff}
.Green{background:#2E9E5B}.Yellow{background:#E0B21F}.Orange{background:#E07A1F}.Red{background:var(--red)}
.ex{border-left:6px solid var(--line)}
.hawk{background:var(--ink);color:#fff;text-align:center;padding:18px}.hawk img{height:44px;margin:4px auto 10px;display:block}.hawk .hk{font-family:'Bebas Neue';font-size:30px;letter-spacing:.04em;line-height:1.05;margin-bottom:6px}.hawk .ds{justify-content:center;margin-top:12px}
.exhead{display:flex;justify-content:space-between;align-items:baseline}
.meta{font-size:13px;opacity:.75;margin:4px 0 8px}
.sugg{font-size:14px;margin-bottom:8px}
.sugg b{color:var(--red)}
.set{display:grid;grid-template-columns:40px 1fr 1fr;gap:8px;align-items:center;margin:6px 0}
.set span{font-family:'Bebas Neue';font-size:22px;text-align:center}
.pr{color:var(--red);font-weight:800}
footer{position:fixed;bottom:8px;right:12px}
footer img{height:40px}
a{color:var(--red)}

/* ===== v2: blocks like the TV ===== */
body{max-width:900px}
#phaseLine{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
#phaseLine .ph{font-family:'Bebas Neue';font-size:30px;letter-spacing:.04em}
#phaseLine .cur{font-family:'Mr Dafoe';font-weight:400;color:var(--red);font-size:38px;letter-spacing:.02em;line-height:1}
#sessSub{font-family:'Bebas Neue';color:var(--fg);opacity:.6;font-size:20px;letter-spacing:.05em;margin:0 0 6px}
#tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:8px 0}
#tabs button{flex:1 0 auto;font-family:'Bebas Neue';font-size:20px;letter-spacing:.05em;padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
#tabs button.on{background:var(--red);border-color:var(--red);color:#fff}
#tabs button.done::after{content:' ✓'}
.band{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;border-radius:10px;padding:8px 14px;margin-top:6px}
.band .l{display:flex;align-items:baseline;gap:12px}
.band .nm{font-family:'Bebas Neue';font-size:30px;letter-spacing:.04em;line-height:1}
.band .q{font-family:'Mr Dafoe';font-weight:400;font-size:30px;letter-spacing:.02em;line-height:1}
.band .tm{font-family:'Bebas Neue';font-size:18px;letter-spacing:.06em}
.exhead h3 .lbl{color:#8a8f98;margin-right:8px}
.blknav{display:flex;gap:10px;margin-top:8px}
.blknav button{flex:1;font-family:'Bebas Neue';font-size:24px;letter-spacing:.05em;padding:14px;border-radius:10px;cursor:pointer;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
.blknav button.go{background:var(--ink);border-color:var(--ink);color:#fff}
.set input{font-size:20px;padding:14px}
.vol{margin-top:6px;font-size:14px;text-align:right}.vol b{font-size:16px}
#wtotal{font-family:'Bebas Neue';font-size:26px;letter-spacing:.04em;text-align:center;margin:14px 0 8px}
.sumbox{background:var(--card);border-radius:10px;padding:12px 14px;margin:10px 0}.sumh{font-family:'Bebas Neue';font-size:24px;letter-spacing:.04em;margin-bottom:6px}.sumr{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}.sumr.tot{border:0;font-family:'Bebas Neue';font-size:24px;padding-top:8px}
.sethdr{display:grid;grid-template-columns:40px 1fr 1fr;gap:8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#8a8f98;margin:10px 0 -2px}.sethdr b{color:var(--fg);font-size:14px}
.fill{margin-left:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:3px 8px;font:700 11px Montserrat,sans-serif;text-transform:none;letter-spacing:0;cursor:pointer}
.rstep{display:flex;gap:6px;align-items:stretch}.rstep input{text-align:center;min-width:0}.rstep button{flex:0 0 52px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-size:24px;font-weight:700;cursor:pointer}
.addset{background:none;border:1px dashed var(--line);color:var(--fg);border-radius:8px;padding:6px 12px;font-family:Montserrat,sans-serif;font-weight:600;font-size:13px;cursor:pointer;margin:4px 0 0}
.exnote{margin-top:8px;font-size:15px;padding:10px 12px;border-style:dashed}
.wset{display:grid;grid-template-columns:40px 1fr 1fr;gap:8px;align-items:center;margin:6px 0;opacity:.75}.wset span{font-family:'Bebas Neue';font-size:18px;text-align:center;color:#8a8f98}.wset input{font-size:18px;padding:10px;border-style:dashed}
.addwu{background:none;border:1px dashed var(--line);color:var(--fg);border-radius:8px;padding:6px 12px;font-family:Montserrat,sans-serif;font-weight:600;font-size:13px;cursor:pointer;margin:4px 0}
.cardio{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.cardio label{font-size:12px;font-weight:800;display:flex;flex-direction:column;gap:4px}.cardio input,.cardio select{font-size:18px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%}.cardio .du{display:flex;gap:6px}.cardio .du select{width:auto}
/* v3: letter groups + choose one */
.ex.gap,.choose.gap{margin-top:34px}
.choose{border:3px dashed #8a8f98;border-radius:14px;padding:6px 10px 10px;margin:12px 0}
.choose .ex{margin:8px 0}
.chz{font-family:'Bebas Neue';color:var(--fg);font-size:22px;letter-spacing:.08em}
.or{font-family:'Mr Dafoe';font-weight:400;color:var(--fg);font-size:32px;text-align:center;line-height:1}
</style></head>
<body>
<header>
  <img class="logo-onyx" src="empwr-logo-en-tag-onyx.svg" alt="EMPWR Fitness and Sports Training">
  <img class="logo-white" src="empwr-logo-en-tag-white.svg" alt="EMPWR Fitness and Sports Training">
  <button id="toggle">☀️</button>
</header>

<!-- STEP 1: WHO -->
<section id="stepWho">
  <h1>Log Your Lift</h1><h2>Who's Training?</h2>
  <div class="card">
    <input id="search" placeholder="Start typing your name" autocomplete="off">
    <div id="results"></div>
  </div>
  <div class="card" style="font-size:13px">Coach mode: pick any member and log for them.</div>
</section>

<!-- STEP 2: READINESS -->
<section id="stepReady" class="hidden">
  <h1 id="hello">Hey</h1><h2>How Are You Feeling?</h2>
  <div class="card" id="scales"></div>
  <button class="main" id="readyBtn">Show My Session</button>
</section>

<!-- STEP 3: SESSION -->
<section id="stepSession" class="hidden">
  <h1 id="sessTitle">Today's Lift</h1><h2 id="sessSub"></h2>
  <div class="card"><span id="badge" class="badge"></span>
    <div id="guidance" style="margin-top:8px;font-size:14px"></div>
    <div id="injury" style="margin-top:8px;font-size:14px"></div></div>
  <div id="exList"></div>
  <button class="main" id="saveBtn">Save Session</button>
  <div id="saved" class="card hidden"></div>
</section>

<footer><img src="pitter-patter-red.svg" alt="Pitter Patter Make It Matter"></footer>

<script>
// ===== CONFIG: paste from Supabase > Project Settings > API =====
const SUPABASE_URL = "https://utljgnuieyjdqclfiwqz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_2nvvJMGijP5Q2OKHZMphEg_fVhCMeW3";
// ================================================================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { db: { schema: 'sgpt' } });
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const enteredBy = params.get('mode') || (params.get('log') !== null ? 'member' : 'tablet'); // ?mode=coach on laptops
const tg=$('toggle'); tg.onclick=()=>{document.body.classList.toggle('dark');tg.textContent=document.body.classList.contains('dark')?'🌙':'☀️';};
let wuStatus={}; const HAWK='https://www.hawkindynamics.com/hs-fs/hubfs/Brand%20Guidelines%202026/Logos/logo_horz-white.png';
document.addEventListener('click',e=>{const b=e.target.closest('.ds button'); if(!b) return; const g=b.parentElement, k=g.dataset.k, v=b.dataset.s;
  wuStatus[k] = wuStatus[k]===v ? null : v; g.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x.dataset.s===wuStatus[k])); });
let member=null, readiness=null, rule=null, items=[], last={}, prs={}, lastSets={}, wk1Max={}, lastNote={};
// Week-4 style 'MAX @ wk 1 wt': spell out how the sets run
const maxRule = it => { const r = String(it.reps||''); if (!/MAX/i.test(r) || !/wk\s*1/i.test(r)) return '';
  const rg = r.match(/MAX\s*(\d+)\s*-\s*(\d+)/i);
  const uni = /LUNGE|SPLIT|STEP\s*UP|1\s*ARM|1\s*LEG|SINGLE|OVR\s*UNDER|MIXED|EACH SIDE/i.test(it.exercise) || /\d+e\b/i.test(r);
  return `Use Your Top Week 1 Weight. Sets 1 + 2: Same Reps As Last Week. Set 3: Max Reps${rg ? ` (Min ${rg[1]}, Max ${rg[2]})` : ''}${uni ? '. One Side, Go Do The Rest, Then Come Back For The Other Side' : ''}.`; };
const isCardio = it => /^RESILIENCY/i.test((it.intensity||'').trim());
// default distance unit per machine at EMPWR
const unitFor = n => /versa/i.test(n) ? 'ft' : /true\s*form/i.test(n) ? 'km' : /woodway|4\s*front/i.test(n) ? 'mi' : /echo|bike/i.test(n) ? 'mi' : /ski|row/i.test(n) ? 'm' : /treadmill/i.test(n) ? 'km' : 'm';
const cardioHtml = it => { const n = it.exercise, u = unitFor(n);
  const tm = /treadmill|woodway|4\s*front|true\s*form/i.test(n), incl = /treadmill|woodway|4\s*front/i.test(n);
  const spd = u==='mi' ? 'mph' : 'km/h';
  return `<div class="cardio"><label>Time<input type="text" inputmode="numeric" placeholder="min:sec" data-c="time"></label><label>Distance<span class="du"><input type="number" inputmode="decimal" placeholder="0" data-c="distance"><select data-c="unit">${['m','km','mi','ft'].map(x=>`<option${x===u?' selected':''}>${x}</option>`).join('')}</select></span></label>${tm ? `<label>Speed (${spd})<input type="number" inputmode="decimal" placeholder="${spd}" data-c="speed"></label>${incl ? `<label>Incline %<input type="number" inputmode="decimal" placeholder="%" data-c="incline"></label>` : `<label>Calories<input type="number" inputmode="numeric" placeholder="cal" data-c="cals"></label>`}` : /echo|bike/i.test(n) ? `<label>Avg Watts<input type="number" inputmode="numeric" placeholder="W" data-c="watts"></label><label>Max Watts<input type="number" inputmode="numeric" placeholder="W" data-c="max_watts"></label><label>Cadence (rpm)<input type="number" inputmode="numeric" placeholder="rpm" data-c="cadence"></label><label>Calories<input type="number" inputmode="numeric" placeholder="cal" data-c="cals"></label>` : `<label>Avg Watts<input type="number" inputmode="numeric" placeholder="W" data-c="watts"></label><label>Calories<input type="number" inputmode="numeric" placeholder="cal" data-c="cals"></label>`}</div>`; };
// pounds moved: weight x reps on working sets (warm-ups not counted), x2 for each-side reps
const fmt = n => Math.round(n).toLocaleString('en-CA');
function updVol(){ let total = 0; const rows = [];
  document.querySelectorAll('.ex[data-mult]').forEach(card => { const m = +card.dataset.mult || 1; let v = 0;
    card.querySelectorAll('.set').forEach(r => { const w = parseFloat(r.querySelector('[data-w]').value), n = parseInt(r.querySelector('[data-r]').value); if (w && n) v += w * n * m; });
    const el = card.querySelector('[data-vol]'); if (el) el.innerHTML = v ? `Total Moved: <b>${fmt(v)} lb</b>` : '';
    if (v) { total += v; rows.push({name: items[+card.dataset.idx].exercise, lb: v}); } });
  const t = $('wtotal'); if (t) t.innerHTML = total ? `Workout Total: <b>${fmt(total)} lb</b>` : '';
  return {total, rows}; }
document.addEventListener('input', e => { if (e.target.matches('.set input')) updVol(); });
// Autofill: copy set 1's number down the whole column
document.addEventListener('click', e => { const b = e.target.closest('.fill'); if (!b) return; const card = b.closest('.ex'), k = b.dataset.c;
  const ins = [...card.querySelectorAll('.set [data-' + k + ']')]; if (!ins.length || !ins[0].value) return; ins.forEach(i => i.value = ins[0].value); updVol(); });
// rep steppers: tap − / + to do less or more than the target
document.addEventListener('click', e => { const b = e.target.closest('.rm,.rp'); if (!b) return; const i = b.parentElement.querySelector('[data-r]');
  i.value = Math.max(0, (parseInt(i.value) || 0) + (b.classList.contains('rp') ? 1 : -1)); updVol(); });
// extra working set: copies the last set's weight and reps
document.addEventListener('click',e=>{ const b=e.target.closest('.addset'); if(!b) return; const rows=b.parentElement.querySelectorAll('.set'), lastRow=rows[rows.length-1];
  const w = lastRow ? lastRow.querySelector('[data-w]').value : '', r = lastRow ? lastRow.querySelector('[data-r]').value : '';
  b.insertAdjacentHTML('beforebegin',`<div class="set"><span>${rows.length+1}</span><input type="number" inputmode="decimal" placeholder="lb" value="${w}" data-w><div class="rstep"><button class="rm" aria-label="One less rep">−</button><input type="number" inputmode="numeric" placeholder="reps" value="${r}" data-r><button class="rp" aria-label="One more rep">+</button></div></div>`); updVol(); });
document.addEventListener('click',e=>{ const b=e.target.closest('.addwu'); if(!b) return; const box=b.previousElementSibling, n=box.children.length+1;
  box.insertAdjacentHTML('beforeend',`<div class="wset"><span>W${n}</span><input type="number" inputmode="decimal" placeholder="lb" data-w><input type="number" inputmode="numeric" placeholder="reps" data-r></div>`); });
const show = id => ['stepWho','stepReady','stepSession'].forEach(s=>$(s).classList.toggle('hidden', s!==id));
const round5 = w => Math.round(w/5)*5;

// STEP 1
let t; $('search').oninput = e => { clearTimeout(t); t = setTimeout(async()=>{
  const q = e.target.value.trim(); if (q.length < 2) { $('results').innerHTML=''; return; }
  const { data } = await sb.from('members').select('id,first_name,last_name')
    .eq('active',true).or(`first_name.ilike.%${q}%,last_name.ilike.%${q}%`).limit(8);
  $('results').innerHTML = (data||[]).map(m=>`<button class="main" style="background:var(--onyx)" data-id="${m.id}" data-n="${m.first_name}">${m.first_name} ${m.last_name}</button>`).join('');
  $('results').querySelectorAll('button').forEach(b=>b.onclick=()=>{ member={id:b.dataset.id,first:b.dataset.n}; startReady(); });
},250); };

// STEP 2
const Q = [['sleep','Sleep'],['energy','Energy'],['soreness','Soreness'],['stress','Stress']];
const QL = {sleep:['Terrible','Poor','Okay','Good','Great'],energy:['Drained','Low','Okay','Good','Fired Up'],soreness:['Very Sore','Sore','Some','A Little','Not Sore'],stress:['Maxed Out','Stressed','Okay','Relaxed','Calm']};
const QC = ['#E5484D','#F07A3C','#C9951A','#6FA22E','#2FA84F'];
const vals = {};
function startReady(){
  $('hello').textContent = `Hey ${member.first}`;
  $('scales').innerHTML = Q.map(([k,l])=>`<div><b>${l}</b><div class="lbls">${QL[k].map((w,i)=>`<span style="color:${QC[i]}">${w}</span>`).join('')}</div><div class="scale" data-k="${k}">${[1,2,3,4,5].map(n=>`<button data-v="${n}">${n}</button>`).join('')}</div></div>`).join('');
  $('scales').querySelectorAll('.scale').forEach(row=>row.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    row.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); vals[row.dataset.k]=+b.dataset.v; }));
  show('stepReady');
}
$('readyBtn').onclick = async () => {
  if (Q.some(([k])=>!vals[k])) { alert('Tap a number for each one.'); return; }
  const { data } = await sb.from('readiness_checkins').insert({member_id:member.id, ...vals}).select().single();
  readiness = data;
  const { data: rules } = await sb.from('readiness_rules').select('*');
  rule = rules.find(r => data.score >= r.min_score && data.score <= r.max_score) || rules[0];
  loadSession();
};

// STEP 3
async function loadSession(){
  const { data } = await sb.from('todays_session').select('*');
  items = data || [];
  if (!items.length) { $('exList').innerHTML = '<div class="card">No session programmed for today.</div>'; show('stepSession'); return; }
  $('sessTitle').textContent = items[0].title || "Today's Lift";
  $('sessSub').textContent = `Week ${items[0].week}, ${items[0].day}`;
  $('badge').textContent = rule.label; $('badge').className = 'badge ' + rule.label;
  $('guidance').textContent = rule.guidance;

  // active injury: point to their protocol
  const { data: inj } = await sb.from('injuries').select('body_area,injury_protocols(pdf_url)').eq('member_id',member.id).neq('status','cleared');
  if (inj && inj.length) $('injury').innerHTML = inj.map(i=>`Active: <b>${i.body_area}</b>. ${i.injury_protocols && i.injury_protocols.pdf_url ? `<a href="${i.injury_protocols.pdf_url}" target="_blank">Open your ${i.body_area} mobility plan</a>` : 'Check with a coach for your mobility plan.'}`).join('<br>');

  // previous weights + PRs for these exercises
  const { data: exIds } = await sb.from('exercises').select('id,name').in('name', items.map(i=>i.exercise));
  const idByName = Object.fromEntries((exIds||[]).map(e=>[e.name,e.id]));
  items.forEach(i => i.exercise_id = idByName[i.exercise]);
  const ids = items.map(i=>i.exercise_id).filter(Boolean);
  // last time this member did each exercise: set by set
  const { data: hist } = await sb.from('set_logs').select('exercise_id,set_number,weight,reps,workout_log_id,created_at').eq('member_id',member.id).in('exercise_id',ids).order('created_at',{ascending:false}).limit(500);
  lastSets = {};
  (hist||[]).forEach(r => { const L = lastSets[r.exercise_id]; if (!L) lastSets[r.exercise_id] = {wl:r.workout_log_id, sets:[r]}; else if (L.wl===r.workout_log_id) L.sets.push(r); });
  Object.entries(lastSets).forEach(([id,L]) => { L.sets.sort((a,b)=>a.set_number-b.set_number); last[id] = Math.max(...L.sets.map(x=>+x.weight)); });
  // last setup note per exercise (handle, machine, seat...) so they set up the same way next time
  lastNote = {}; { const { data: wls } = await sb.from('workout_logs').select('notes,created_at').eq('member_id',member.id).order('created_at',{ascending:false}).limit(40);
    (wls||[]).forEach(w => { let x; try { x = JSON.parse(w.notes||'{}'); } catch(e) { return; } ((x && x.notes)||[]).forEach(n => { if (n.exercise_id && !(n.exercise_id in lastNote)) lastNote[n.exercise_id] = n.note; }); }); }
  // heaviest weight logged in Week 1 of this block (for 'MAX @ wk 1 wt' weeks)
  wk1Max = {}; { const d0 = new Date(); d0.setHours(0,0,0,0); d0.setDate(d0.getDate() - ((d0.getDay()+6)%7) - 7*((items[0].week||1)-1)); const d1 = new Date(d0); d1.setDate(d1.getDate()+7);
    (hist||[]).forEach(r => { const t = new Date(r.created_at); if (t >= d0 && t < d1) wk1Max[r.exercise_id] = Math.max(wk1Max[r.exercise_id]||0, +r.weight); }); }
  const { data: pr } = await sb.from('personal_records').select('*').eq('member_id',member.id).in('exercise_id',ids);
  (pr||[]).forEach(r => { (prs[r.exercise_id] ||= {})[r.pr_type] = r.value; });

  // Phase line, like the TV
  const t = (items[0].title||'').trim();
  const tc = x => x === x.toUpperCase() ? x.toLowerCase().replace(/(^|\s|&)(\w)/g,(m,a,b)=>a+b.toUpperCase()) : x;
  const ph = (t.match(/\[\s*(phase\s*\d+)\s*\]/i)||[])[1] || '';
  const aim = t.split('--').pop().replace(/\[.*?\]/g,'').trim();
  $('sessTitle').innerHTML = `<div id="phaseLine"><span class="ph">${ph ? tc(ph) : ''}</span><span class="cur">${tc(aim)}</span></div>`;
  const d = new Date();
  $('sessSub').textContent = `${d.toLocaleDateString('en-CA',{weekday:'long'})} · ${d.toLocaleDateString('en-CA',{month:'short',day:'numeric'}).replace(/\./g,'')} · Week ${items[0].week}`;

  // Group into blocks exactly like the TV
  const blocks = []; let cur = null;
  items.forEach((it,idx)=>{
    const raw = (it.intensity||'').replace(/\s+/g,' ').trim();
    const nm = raw.replace(/\[.*?\]/g,'').trim().split(' ')[0] || 'Today';
    let q = (raw.match(/\[(.*?)\]/)||[])[1] || raw.replace(/\[.*?\]/g,'').trim().split(' ').slice(1).join(' ');
    if (nm.includes('☠')) q = 'Choose 🤗 1';
    if (!cur || cur.raw !== raw){ cur = {raw, nm, q: tc(q), tm: it.rest||'', idx: []}; blocks.push(cur); }
    cur.idx.push(idx);
  });
  const repsOf = it => String(it.reps||'').split('|').pop().trim();
  const schemeOf = it => it.sets ? (repsOf(it) ? `${it.sets} x ${repsOf(it)}` : `${it.sets} set${it.sets>1?'s':''}`) : repsOf(it);

  // Blank sets/reps = same as the exercise before it in the block
  blocks.forEach(b=>b.idx.forEach((ix,k)=>{ const it=items[ix];
    if (it.tempo && !/^(COACH|FOAM|SET|TURF|FLOOR)$/.test(it.tempo) && !it.sets && !repsOf(it) && k>0){ const pv=items[b.idx[k-1]]; it.sets=pv.sets; it.reps=pv.reps; } }));
  const letterOf = it => ((it.tempo||'').match(/^[A-Z]/i)||[''])[0].toUpperCase();
  const gapSet = new Set();
  const blockHtml = b => { let html='', prev=null; const L=b.idx;
    if (/^REACTIVE/i.test(b.nm) && /intro/i.test(b.q)) {
      // Reactive Intro: drills are a coach note, members go jump on the Hawkin plate
      const fp = L.map(ix=>items[ix]).find(it=>/force\s*plate/i.test(it.exercise));
      const note = L.map(ix=>items[ix]).filter(it=>it!==fp).map(it=>it.exercise.replace(/^•\s*/,'')).join(' · ');
      const cue = fp ? tc(fp.exercise.replace(/\s+-\s+/g,', ')).replace(/!+$/,'') : 'Test Your Jump On The Force Plate';
      return (note ? `<div class="meta" style="font-style:italic;margin:10px 0">Coach note: ${note}</div>` : '') +
        `<div class="card hawk"><img src="${HAWK}" alt="Hawkin Dynamics"><div class="hk">Go Jump On The Hawkin Force Plate</div><div class="meta" style="color:#cfd3da">${cue}</div>${dsBtns('hawkin')}</div>`;
    }
    for (let k=0;k<L.length;k++){ const it=items[L[k]], lbl=it.tempo||'', le=letterOf(it);
      const gap = prev!==null && le && le!==prev; prev = le||prev;
      if (lbl && !WU.has(lbl) && L[k+1]!==undefined && items[L[k+1]].tempo===lbl){
        const grp=[L[k]]; while(L[k+1]!==undefined && items[L[k+1]].tempo===lbl) grp.push(L[++k]);
        html += `<div class="choose${gap?' gap':''}"><div class="chz">Choose 1</div>${grp.map(card).join('<div class="or">or</div>')}</div>`;
      } else { if (gap) gapSet.add(L[k]); html += card(L[k]); gapSet.delete(L[k]); }
    } return html; };
  const WU = new Set(['COACH','FOAM','SET','TURF','FLOOR']);
  const wuRank = ix => { const it = items[ix], t = it.tempo||''; return ({COACH:0,FOAM:1,SET:2,TURF:3,FLOOR:5}[t] ?? 4) + (t==='FLOOR' && /KOMODO|CRAWL/i.test(it.exercise) ? 0.5 : 0); };
  blocks.forEach(b=>{ if (b.nm==='RELEASE') b.idx.sort((x,y)=>wuRank(x)-wuRank(y) || x-y); });
  let wuLast = '';
  const dsBtns = k => `<span class="ds" data-k="${k}"><button data-s="done"${wuStatus[k]==='done'?' class="on"':''}>✓ Done</button><button data-s="skip"${wuStatus[k]==='skip'?' class="on"':''}>Skip</button></span>`;
  const card = idx => { const it = items[idx];
    const tg = it.tempo||'';
    if (WU.has(tg)) {
      if (tg==='COACH') return `<div class="meta" style="font-style:italic">Coach note: ${it.exercise}</div>`;
      if (tg==='FOAM') return `<div class="card" style="background:var(--ink);color:#fff;font-family:'Bebas Neue';font-size:24px;letter-spacing:.04em;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><span>${it.exercise.replace(/\s*-->\s*/g,' → ').replace(/➡️/g,'→')}</span>${dsBtns('foam')}</div>`;
      if (tg==='SET') return `<h2 style="margin:10px 0 0">${it.exercise}</h2>`;
      const head = wuLast!==tg ? `<div style="background:var(--ink);color:#fff;font-family:'Bebas Neue';font-size:22px;letter-spacing:.06em;border-radius:8px;padding:6px 12px;margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:10px"><span><span style="color:var(--red)">${tg==='TURF'?'1':'2'}</span> ${tg==='TURF'?'Turf Drills':'Lunges, Hips + Crawl'}</span>${dsBtns(tg==='TURF'?'turf':'floor')}</div>` : '';
      wuLast = tg;
      return head + `<div class="card ex" data-idx="${idx}"><div class="exhead"><h3>${it.exercise.replace(/\bx\d+( each side)?/gi, m=>`<span style="color:var(--red)">${m}</span>`)}</h3><b>${schemeOf(it)}</b></div></div>`;
    }
    const head = `<div class="exhead"><h3><span class="lbl">${it.tempo||''}</span>${it.exercise}</h3><b>${schemeOf(it)}</b></div>
      ${it.video_url?`<div class="meta"><a href="${it.video_url}" target="_blank">Video</a></div>`:''}`;
    if (isCardio(it)) return `<div class="card ex cardioex${gapSet.has(idx)?' gap':''}" data-idx="${idx}">${head}${cardioHtml(it)}</div>`;
    const lift = it.sets && !/^(REACTIVE|RUN)/i.test(it.intensity||'');
    const L = lastSets[it.exercise_id];
    const pct = rule.load_pct/100;
    const p = prs[it.exercise_id] || {};
    const nSets = Math.max(1, it.sets || 3);
    const mr = maxRule(it), w1 = wk1Max[it.exercise_id];
    const wFor = s => { if (mr && w1) return w1; if (!L) return ''; const x = L.sets[s] || L.sets[L.sets.length-1]; return x && x.weight ? round5(x.weight*pct) : ''; };
    const rFor = s => { if (mr) { if (s === nSets-1) return ''; const x = L && (L.sets[s] || L.sets[L.sets.length-1]); return x ? x.reps : ''; } return parseInt(repsOf(it))||''; };
    return `<div class="card ex${gapSet.has(idx)?' gap':''}" data-idx="${idx}" data-mult="${/\de\b/i.test(repsOf(it)) ? 2 : 1}">${head}
      <div class="sugg">${mr ? `<div style="font-weight:700;margin-bottom:4px">${mr}${w1 ? ` Your Week 1 top weight: ${w1} lb.` : ''}</div>` : ''}${!lift ? '' : L ? `Last time: ${L.sets.map(x=>`${+x.weight} × ${x.reps}`).join(' · ')}${rule.load_pct<100?`<br>Today's weights are ${100-rule.load_pct}% lighter (readiness).`:''}` : 'First time logging this one. Pick a weight you can own.'}
        ${p.heaviest?`<br>PRs: heaviest ${p.heaviest} | est. 5RM ${p.est_5rm||'-'} | best volume ${p.session_volume||'-'}`:''}</div>
      ${!lift ? '' : `<div class="wus"></div><button class="addwu">+ Warm-Up Set</button><div class="sethdr"><span></span><span>Weight (lb) <button class="fill" data-c="w">Autofill ↓</button></span><span>Reps${repsOf(it) ? ` · Target <b>${repsOf(it)}</b>` : ''} <button class="fill" data-c="r">Autofill ↓</button></span></div>` + Array.from({length:nSets},(_,s)=>`<div class="set"><span>${s+1}</span>
        <input type="number" inputmode="decimal" placeholder="lb" value="${wFor(s)}" data-w>
        <div class="rstep"><button class="rm" aria-label="One less rep">−</button><input type="number" inputmode="numeric" placeholder="${mr && s === nSets-1 ? 'max' : 'reps'}" value="${rFor(s)}" data-r><button class="rp" aria-label="One more rep">+</button></div></div>`).join('')}
      ${!lift ? '' : '<div class="vol" data-vol></div><button class="addset">+ Add A Set</button>'}
      <input type="text" class="exnote" placeholder="Setup Note: Handle, Machine, Seat... (optional)" maxlength="140" value="${(lastNote[it.exercise_id]||'').replace(/"/g,'&quot;')}" data-note>
    </div>`; };

  // Members only log from the lift on: warm-up, reactive and run are coach-led
  { const k = blocks.findIndex(b => !/^(RELEASE|REACTIVE|RUN)/i.test(b.nm)); if (k > 0) blocks.splice(0, k); }
  $('exList').innerHTML =
    `<div id="tabs">${blocks.map((b,i)=>`<button data-b="${i}">${b.nm}${/intro/i.test(b.q)?' Intro':''}</button>`).join('')}</div>` +
    blocks.map((b,i)=>`<div class="blk" data-b="${i}">
      <div class="band"><div class="l"><span class="nm">${b.nm}</span><span class="q">${b.q}</span></div><span class="tm">${b.tm ? b.tm+' min' : ''}</span></div>
      ${blockHtml(b)}
      <div class="blknav">${i>0?`<button data-go="${i-1}">‹ ${blocks[i-1].nm}</button>`:''}${i<blocks.length-1?`<button class="go" data-go="${i+1}">Next: ${blocks[i+1].nm} ›</button>`:''}</div>
    </div>`).join('');
  const showBlock = i => {
    document.querySelectorAll('.blk').forEach(el=>el.classList.toggle('hidden', +el.dataset.b !== i));
    document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', +b.dataset.b === i));
    scrollTo(0,0);
  };
  document.querySelectorAll('#tabs button, .blknav button').forEach(b=>b.onclick=()=>showBlock(+(b.dataset.b ?? b.dataset.go)));
  showBlock(0);
  if (!$('wtotal')) $('saveBtn').insertAdjacentHTML('beforebegin','<div id="wtotal"></div>');
  updVol();
  show('stepSession');
}

$('saveBtn').onclick = async () => {
  $('saveBtn').disabled = true;
  const extra = { warmup: wuStatus, warmup_sets: [], cardio: [] };
  document.querySelectorAll('.ex').forEach(card=>{ const it = items[+card.dataset.idx];
    card.querySelectorAll('.wset').forEach((row,s)=>{ const w=parseFloat(row.querySelector('[data-w]').value), r=parseInt(row.querySelector('[data-r]').value);
      if (w||r) extra.warmup_sets.push({exercise_id: it.exercise_id, exercise: it.exercise, set: s+1, weight: w||null, reps: r||null}); });
    const c = card.querySelector('.cardio'); if (c) { const o = {exercise_id: it.exercise_id, exercise: it.exercise};
      c.querySelectorAll('[data-c]').forEach(f=>{ if (f.value) o[f.dataset.c] = f.tagName==='SELECT' ? f.value : (f.dataset.c==='time' ? f.value : parseFloat(f.value)); });
      if (o.time || o.distance || o.watts || o.max_watts || o.cadence || o.cals || o.speed) extra.cardio.push(o); }
    const nt = card.querySelector('[data-note]'); if (nt && nt.value.trim()) (extra.notes ||= []).push({exercise_id: it.exercise_id, exercise: it.exercise, note: nt.value.trim()}); });
  const { data: wl, error } = await sb.from('workout_logs').insert({
    member_id: member.id, session_id: items[0] && items[0].session_id,
    entered_by: enteredBy, readiness_id: readiness && readiness.id, notes: JSON.stringify(extra) }).select().single();
  if (error) { alert('Could not save. Try again.'); $('saveBtn').disabled=false; return; }
  const rows = [];
  document.querySelectorAll('.ex').forEach(card=>{
    const it = items[+card.dataset.idx];
    card.querySelectorAll('.set').forEach((row,s)=>{
      const w = parseFloat(row.querySelector('[data-w]').value), r = parseInt(row.querySelector('[data-r]').value);
      if (w && r && it.exercise_id) rows.push({workout_log_id: wl.id, member_id: member.id, exercise_id: it.exercise_id, set_number: s+1, weight: w, reps: r});
    });
  });
  if (rows.length) await sb.from('set_logs').insert(rows);
  // check what got beaten
  const today = new Date().toISOString().slice(0,10);
  const { data: newPr } = await sb.from('personal_records').select('pr_type,value,exercises(name)').eq('member_id',member.id).eq('achieved_on',today);
  const label = {heaviest:'Heaviest',est_5rm:'Est. 5RM',session_volume:'Volume'};
  const vs = updVol();
  $('saved').innerHTML = `<h3>Saved. Nice Work, ${member.first}.</h3>` +
    (vs.total ? `<div class="sumbox"><div class="sumh">Your Lift Summary</div>${vs.rows.map(r=>`<div class="sumr"><span>${r.name}</span><b>${fmt(r.lb)} lb</b></div>`).join('')}<div class="sumr tot"><span>Total Moved Today</span><b>${fmt(vs.total)} lb</b></div></div>` : '') +
    (newPr && newPr.length ? newPr.map(p=>`<div class="pr">🔥 New ${label[p.pr_type]} PR: ${p.exercises.name} ${p.value}</div>`).join('') : '<div>Logged. See you next session.</div>') +
    `<button class="main" onclick="location.reload()">Next Person</button>`;
  $('saved').classList.remove('hidden'); $('saveBtn').classList.add('hidden');
};
</script></body></html>
