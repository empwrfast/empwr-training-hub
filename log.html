<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>

body{background:var(--bg);color:var(--fg);font-family:Montserrat,sans-serif;max-width:640px;margin:auto;padding:16px 16px 90px}

.rstep{display:flex;gap:6px;align-items:stretch}.rstep input{text-align:center;min-width:0}.rstep button{flex:0 0 52px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-size:24px;font-weight:700;cursor:pointer}
.optp{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.optp .chz2{width:100%;font-family:'Bebas Neue';font-size:18px;letter-spacing:.06em}
.optp button{border:2px solid var(--line);background:var(--bg);color:var(--fg);border-radius:20px;padding:10px 16px;font:700 15px Montserrat,sans-serif;cursor:pointer}

.optp button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rbox{display:flex;flex-direction:column;gap:6px}.rbox .sl{font:800 11px Montserrat,sans-serif;color:var(--mute);flex:0 0 18px;align-self:center;text-align:center}
.rstep.r2{display:none}.ex.sd .rstep.r2{display:flex}.rstep .sl{display:none}.ex.sd .rstep .sl{display:block}
.set .xs{display:block;border:0;background:none;color:var(--mute);font-size:16px;font-weight:800;cursor:pointer;padding:0}
.addset{background:none;border:1px dashed var(--line);color:var(--fg);border-radius:8px;padding:6px 12px;font-family:Montserrat,sans-serif;font-weight:600;font-size:13px;cursor:pointer;margin:4px 0 0}
.exnote{margin-top:8px;font-size:15px;padding:10px 12px;border-style:dashed}
.wset{display:grid;grid-template-columns:40px 1fr 1fr;gap:8px;align-items:center;margin:6px 0;opacity:.75}.wset span{font-family:'Bebas Neue';font-size:18px;text-align:center;color:#8a8f98}.wset input{font-size:18px;padding:10px;border-style:dashed}
.addwu{background:none;border:1px dashed var(--line);color:var(--fg);border-radius:8px;padding:6px 12px;font-family:Montserrat,sans-serif;font-weight:600;font-size:13px;cursor:pointer;margin:4px 0}
.cardio{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.cardio label{font-size:12px;font-weight:800;display:flex;flex-direction:column;gap:4px}.cardio input,.cardio select{font-size:18px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%}.cardio .du{display:flex;gap:6px}.cardio .du select{width:auto}
/* v3: letter groups + choose one */
.ex.gap,.choose.gap{margin-top:34px}
.choose{border:3px dashed #8a8f98;border-radius:14px;padding:6px 10px 10px;margin:12px 0}
.choose .ex{margin:8px 0}
.chz{font-family:'Bebas Neue';color:var(--fg);font-size:22px;letter-spacing:.08em}
.or{font-family:'Mr Dafoe';font-weight:400;color:var(--fg);font-size:32px;text-align:center;line-height:1}
.weekSel{font:inherit;color:inherit;background:none;border:0;border-bottom:2px dotted currentColor;padding:0;cursor:pointer;letter-spacing:inherit}
.slotBtn{font:inherit;color:inherit;background:none;border:0;border-bottom:2px dotted currentColor;padding:0;cursor:pointer;letter-spacing:inherit}
</style></head>
<body>
<header>
  <img class="logo-onyx" src="empwr-logo-en-tag-onyx.svg" alt="EMPWR Fitness and Sports Training">

<!-- STEP 1: WHO -->
<section id="stepWho">
  <h1>Log Your Lift</h1><h2>Who's Training?</h2>

    <input id="search" placeholder="Start typing your name" autocomplete="off">

<!-- MY PROGRESS (current members only: the name search only finds active members) -->

<section id="stepSession" class="hidden">
  <h1 id="sessTitle">Today's Lift</h1><h2 id="sessSub"></h2>

    <div id="guidance" style="margin-top:8px;font-size:14px"></div>

<footer><img src="pitter-patter-red.svg" alt="Pitter Patter Make It Matter"></footer>

<script>
// ===== CONFIG: paste from Supabase > Project Settings > API =====
const SUPABASE_URL = "https://utljgnuieyjdqclfiwqz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_2nvvJMGijP5Q2OKHZMphEg_fVhCMeW3";
// ================================================================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { db: { schema: 'sgpt' } });
// Class time slots: shows the class on now (from 20 min before it starts); tap the time to switch classes
const fmtSlot = s => { if (!s) return ''; const [h, m] = s.split(':').map(Number); return ((h + 11) % 12 + 1) + (m ? ':' + String(m).padStart(2, '0') : '') + (h < 12 ? 'AM' : 'PM'); };
function pickedSlot(){ try { const v = JSON.parse(localStorage.getItem('empwrSlot') || 'null'); if (v && v.until > Date.now()) return v.slot; } catch (e) {} return null; }
function pickSlot(s){ try { localStorage.setItem('empwrSlot', JSON.stringify({ slot: s, until: Date.now() + 75 * 60000 })); } catch (e) {} }
let SLOTS = [];
async function baseRows(cols){
  const { data: all } = await sb.from('day_sessions').select('slot');
  SLOTS = [...new Set((all || []).map(r => r.slot))].sort();
  const p = pickedSlot();
  if (p && SLOTS.includes(p)) return sb.from('day_sessions').select(cols || '*').eq('slot', p).order('item_order');
  return sb.from('todays_session').select(cols || '*').order('item_order');
}
// ===== PROGRAM WEEK: defaults to this week; pick another week of the same block (kept on this device for today)
let WEEKS = [], baseWeek = null;
const todayKey = () => new Date().toLocaleDateString('en-CA');
function pickedWeek(){ try { const v = JSON.parse(localStorage.getItem('empwrWeek') || 'null'); if (v && v.day === todayKey()) return v.week; } catch (e) {} return null; }
function pickWeek(w){ try { localStorage.setItem('empwrWeek', JSON.stringify({ week: w, day: todayKey() })); } catch (e) {} }
async function sessionRows(cols){ const res = await baseRows(); let rows = res.data || [];
  if (!rows.length) return res; baseWeek = rows[0].week;
  try {
    const { data: cur } = await sb.from('program_sessions').select('id,block_id,day,slot,week').eq('id', rows[0].session_id).single();
    if (!cur) return res;
    const { data: sib } = await sb.from('program_sessions').select('id,week,title,day,slot').eq('block_id', cur.block_id).eq('day', cur.day).eq('slot', cur.slot).order('week');
    WEEKS = [...new Set((sib || []).map(s => s.week))];
    const toRows = async (pi, tgt) => { const ids = [...new Set((pi || []).map(x => x.exercise_id).filter(Boolean))];
      const { data: ex } = ids.length ? await sb.from('exercises').select('id,name,video_url').in('id', ids) : { data: [] };
      const by = Object.fromEntries((ex || []).map(e => [e.id, e]));
      return (pi || []).map(x => ({ session_id: tgt.id, title: tgt.title, week: tgt.week, day: tgt.day, slot: rows[0].slot, item_order: x.item_order,
        exercise: (by[x.exercise_id] || {}).name ?? null, sets: x.sets, reps: x.reps, tempo: x.tempo, rest: x.rest, intensity: x.intensity, video_url: (by[x.exercise_id] || {}).video_url ?? null })); };
    const w = pickedWeek(), tgt = w && w !== cur.week && (sib || []).find(s => s.week === w);
    if (tgt) { const { data: pi } = await sb.from('program_items').select('*').eq('session_id', tgt.id).order('item_order'); rows = await toRows(pi, tgt); }
    // Resiliency "choose #1-6": the sheet puts option 1 on the Wk 2 row, option 2 on Wk 3, etc., so the sync spreads them across weeks.
    // Pull every numbered option for this class from all weeks of the block and show them all, every week.
    const { data: rp } = await sb.from('program_items').select('*').in('session_id', (sib || []).map(s => s.id)).ilike('intensity', 'RESILIENCY%').order('item_order');
    const opts = []; (rp || []).forEach(x => { if (x.exercise_id && !opts.some(o => o.exercise_id === x.exercise_id)) opts.push(x); });
    if (opts.length > 1) { const me = (sib || []).find(s => s.week === rows[0].week) || { id: rows[0].session_id, title: rows[0].title, week: rows[0].week, day: rows[0].day };
      opts.sort((a, b) => (parseInt(a.tempo) || 99) - (parseInt(b.tempo) || 99));
      const isR = r => /^RESILIENCY/i.test((r.intensity || '').trim()) && !!r.exercise, at = rows.findIndex(isR), inten = at >= 0 ? rows[at].intensity : null;
      const all = (await toRows(opts.map(o => ({ ...o, sets: o.sets || 1 })), me)).map(r => ({ ...r, intensity: inten || r.intensity }));
      const kept = rows.filter(r => !isR(r)), pos = at < 0 ? kept.length : at;
      rows = [...kept.slice(0, pos), ...all, ...kept.slice(pos)]; }
    return { data: rows };
  } catch (e) { return res; } }
const weekSel = w => WEEKS.length > 1 ? `<select class="weekSel" title="Which week of the program?">${WEEKS.map(x => `<option value="${x}"${x === w ? ' selected' : ''}>Week ${x}</option>`).join('')}</select>` : `Week ${w}`;
const nextSlot = cur => SLOTS.length ? SLOTS[(SLOTS.indexOf(cur) + 1) % SLOTS.length] : cur;
const slotBtn = s => SLOTS.length > 1 ? `<button class="slotBtn" title="Tap to switch class">${fmtSlot(s)} ▸</button>` : fmtSlot(s);

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const enteredBy = params.get('mode') || (params.get('log') !== null ? 'member' : 'tablet'); // ?mode=coach on laptops
const tg=$('toggle'); tg.onclick=()=>{document.body.classList.toggle('dark');tg.textContent=document.body.classList.contains('dark')?'🌙':'☀️';};
let wuStatus={}; const HAWK='https://www.hawkindynamics.com/hs-fs/hubfs/Brand%20Guidelines%202026/Logos/logo_horz-white.png';
document.addEventListener('click',e=>{const b=e.target.closest('.ds button'); if(!b) return; const g=b.parentElement, k=g.dataset.k, v=b.dataset.s;
  wuStatus[k] = wuStatus[k]===v ? null : v; g.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x.dataset.s===wuStatus[k])); });
let member=null, readiness=null, rule=null, items=[], last={}, prs={}, lastSets={}, wk1Max={}, lastNote={};
// Week-4 style 'MAX @ wk 1 wt': spell out how the sets run
// last set range: from the sheet ("MAX 9-11 @ wk 1 wt") or 1.5x the base reps (6 -> min 9, max 11); base = last week's reps, 6 if no history
const MAX_BASE = 6;
const maxRange = (it, base) => { const m = String(it.reps||'').match(/MAX\s*(\d+)\s*-\s*(\d+)/i); if (m) return [+m[1], +m[2]]; const lo = Math.round((base || MAX_BASE) * 1.5); return [lo, lo + 2]; };
const maxRule = (it, base) => { const r = String(it.reps||''); if (!/MAX/i.test(r) || !/wk\s*1/i.test(r)) return '';
  const rg = maxRange(it, base);
  const uni = /LUNGE|SPLIT|STEP\s*UP|1\s*ARM|1\s*LEG|SINGLE|OVR\s*UNDER|MIXED|EACH SIDE/i.test(it.exercise) || /\d+e\b/i.test(r);
  return `Use Your Top Week 1 Weight. Sets 1 + 2: Same Reps As Last Week. Set 3: Max Reps (Min ${rg[0]}, Max ${rg[1]})${uni ? '. One Side, Go Do The Rest, Then Come Back For The Other Side' : ''}.`; };
const isCardio = it => /^RESILIENCY/i.test((it.intensity||'').trim());
// default distance unit per machine at EMPWR
const unitFor = n => /versa/i.test(n) ? 'ft' : /true\s*form/i.test(n) ? 'km' : /woodway|4\s*front/i.test(n) ? 'mi' : /echo|bike/i.test(n) ? 'mi' : /ski|row/i.test(n) ? 'm' : /treadmill/i.test(n) ? 'km' : 'm';
const cardioHtml = it => { const n = it.exercise, u = unitFor(n);
  const tm = /treadmill|woodway|4\s*front|true\s*form/i.test(n), incl = /treadmill|woodway|4\s*front/i.test(n);
  const spd = u==='mi' ? 'mph' : 'km/h';

  blocks.forEach(b=>{ if (b.nm==='RELEASE') b.idx.sort((x,y)=>wuRank(x)-wuRank(y) || x-y); });
  let wuLast = '';
  const dsBtns = k => `<span class="ds" data-k="${k}"><button data-s="done"${wuStatus[k]==='done'?' class="on"':''}>✓ Done</button><button data-s="skip"${wuStatus[k]==='skip'?' class="on"':''}>Skip</button></span>`;
  const card = idx => { const it = items[idx];
    const tg = it.tempo||'';
    if (WU.has(tg)) {
      if (tg==='COACH') return `<div class="meta" style="font-style:italic">Coach note: ${it.exercise}</div>`;
      if (tg==='FOAM') return `<div class="card" style="background:var(--ink);color:#fff;font-family:'Bebas Neue';font-size:24px;letter-spacing:.04em;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><span>${it.exercise.replace(/\s*-->\s*/g,' → ').replace(/➡️/g,'→')}</span>${dsBtns('foam')}</div>`;
      if (tg==='SET') return `<h2 style="margin:10px 0 0">${it.exercise}</h2>`;
      const head = wuLast!==tg ? `<div style="background:var(--ink);color:#fff;font-family:'Bebas Neue';font-size:22px;letter-spacing:.06em;border-radius:8px;padding:6px 12px;margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:10px"><span><span style="color:var(--red)">${tg==='TURF'?'1':'2'}</span> ${tg==='TURF'?'Turf Drills':'Lunges, Hips + Crawl'}</span>${dsBtns(tg==='TURF'?'turf':'floor')}</div>` : '';
      wuLast = tg;
      return head + `<div class="card ex" data-idx="${idx}"><div class="exhead"><h3>${it.exercise.replace(/\bx\d+( each side)?/gi, m=>`<span style="color:var(--red)">${m}</span>`)}</h3><b>${schemeOf(it)}</b></div></div>`;
    }
    const head = `<div class="exhead"><h3><span class="lbl">${it.tempo||''}</span>${it.exercise}</h3><b>${schemeOf(it)}</b></div>
      ${it.video_url?`<div class="meta"><a href="${it.video_url}" target="_blank">Video</a></div>`:''}`;
    if (isCardio(it)) return `<div class="card ex cardioex${gapSet.has(idx)?' gap':''}" data-idx="${idx}">${head}${cardioHtml(it)}</div>`;
    const lift = it.sets && !/^(REACTIVE|RUN)/i.test(it.intensity||'');
    const opts = optsOf(it), md = modeOf(it, 0);
    const L = lastSets[exIdOf(it, 0)];
    const pct = rule.load_pct/100;
    const p = prs[it.exercise_id] || {};
    const nSets = Math.max(1, it.sets || 3);
    const base = L && L.sets[0] ? +L.sets[0].reps : MAX_BASE, mr = maxRule(it, base), w1 = wk1Max[exIdOf(it, 0)], rg = maxRange(it, base);
    const mult = /\de\b/i.test(repsOf(it)) || (mr && /LUNGE|SPLIT|STEP\s*UP|1\s*ARM|1\s*LEG|SINGLE|\bSL\b|\bSA\b|EACH SIDE/i.test(it.exercise)) ? 2 : 1;
    const wFor = s => { if (mr && w1) return w1; if (!L) return ''; const x = L.sets[s] || L.sets[L.sets.length-1]; return x && x.weight ? round5(x.weight*pct) : ''; };
    const rFor = s => { if (md.bw) return ''; if (mr) { if (s === nSets-1) return ''; const x = L && (L.sets[s] || L.sets[L.sets.length-1]); return x ? x.reps : MAX_BASE; } return parseInt(repsOf(it))||''; };
    return `<div class="card ex${gapSet.has(idx)?' gap':''}${md.sides ? ' sd' : ''}" data-idx="${idx}" data-o="0" data-mult="${mult}" data-prev="${L ? L.sets.reduce((a,x)=>a+(+x.weight||0)*(+x.reps||0),0)*mult : 0}">${head}
      ${opts && lift ? `<div class="optp"><div class="chz2">Pick One</div>${opts.map((o,i)=>`<button data-o="${i}" class="${i?'':'on'}">${o.label}</button>`).join('')}${opts.some(o=>o.bw) ? '<div style="font-size:13px;width:100%">Chin-Ups: Leave Weight On BW For Bodyweight, Or Type Only The Weight You Added.</div>' : ''}</div>` : ''}
      <div class="sugg">${mr ? `<div style="font-weight:700;margin-bottom:4px">${mr}${w1 ? ` Your Week 1 top weight: ${w1} lb.` : ''}</div>` : ''}${!lift ? '' : L ? `<span class="lastln">Last time: ${L.sets.map(x=>`${+x.weight ? +x.weight : 'BW'} × ${x.reps}`).join(' · ')}</span>${rule.load_pct<100?`<br>Today's weights are ${100-rule.load_pct}% lighter (readiness).`:''}` : '<span class="lastln">First time logging this one. Pick a weight you can own.</span>'}
        ${p.heaviest?`<br>PRs: heaviest ${p.heaviest} | est. 5RM ${p.est_5rm||'-'} | best volume ${p.session_volume||'-'}`:''}</div>
      ${!lift ? '' : `<div class="wus"></div><button class="addwu">+ Warm-Up Set</button><div class="sethdr"><span></span><span>Weight (lb) <button class="fill" data-c="w">Autofill ↓</button></span><span>Reps${repsOf(it) ? ` · Target <b>${repsOf(it)}</b>` : ''} <button class="fill" data-c="r">Autofill ↓</button></span></div>` + Array.from({length:nSets},(_,s)=>`<div class="set"><span>${s+1}</span>
        <input type="number" inputmode="decimal" placeholder="${md.bw ? 'BW' : 'lb'}" value="${wFor(s)}" data-w>
        <div class="rbox"><div class="rstep"><span class="sl">L</span><button class="rm" aria-label="One less rep">−</button><input type="number" inputmode="numeric" placeholder="${mr && s === nSets-1 ? `max ${rg[0]}-${rg[1]}` : 'reps'}" value="${rFor(s)}" data-r><button class="rp" aria-label="One more rep">+</button></div>
        <div class="rstep r2"><span class="sl">R</span><button class="rm" aria-label="One less rep">−</button><input type="number" inputmode="numeric" placeholder="${mr && s === nSets-1 ? `max ${rg[0]}-${rg[1]}` : 'reps'}" value="${rFor(s)}" data-r2><button class="rp" aria-label="One more rep">+</button></div></div></div>`).join('')}
      ${!lift ? '' : '<div class="vol" data-vol></div><button class="addset">+ Add A Set</button>'}
      <input type="text" class="exnote" placeholder="Setup Note: Handle, Machine, Seat... (optional)" maxlength="140" value="${(lastNote[it.exercise_id]||'').replace(/"/g,'&quot;')}" data-note>
    </div>`; };

  // Members only log from the lift on: warm-up, reactive and run are coach-led
  { const k = blocks.findIndex(b => !/^(RELEASE|REACTIVE|RUN)/i.test(b.nm)); if (k > 0) blocks.splice(0, k); }
  $('exList').innerHTML =
    `<div id="tabs">${blocks.map((b,i)=>`<button data-b="${i}">${b.nm}${/intro/i.test(b.q)?' Intro':''}</button>`).join('')}</div>` +
    blocks.map((b,i)=>`<div class="blk" data-b="${i}">
      <div class="band"><div class="l"><span class="nm">${b.nm}</span><span class="q">${b.q}</span></div><span class="tm">${b.tm ? b.tm+' min' : ''}</span></div>
      ${blockHtml(b)}
      <div class="blknav">${i>0?`<button data-go="${i-1}">‹ ${blocks[i-1].nm}</button>`:''}${i<blocks.length-1?`<button class="go" data-go="${i+1}">Next: ${blocks[i+1].nm} ›</button>`:''}</div>
    </div>`).join('');
  const showBlock = i => {
    document.querySelectorAll('.blk').forEach(el=>el.classList.toggle('hidden', +el.dataset.b !== i));
    document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', +b.dataset.b === i));
    scrollTo(0,0);
  };
  document.querySelectorAll('#tabs button, .blknav button').forEach(b=>b.onclick=()=>showBlock(+(b.dataset.b ?? b.dataset.go)));
  showBlock(0);
  if (!$('wtotal')) $('saveBtn').insertAdjacentHTML('beforebegin','<div id="wtotal"></div>');
  updVol();
  show('stepSession');
}

$('saveBtn').onclick = async () => {
  $('saveBtn').disabled = true;
  const extra = { warmup: wuStatus, warmup_sets: [], cardio: [] };
  document.querySelectorAll('.ex').forEach(card=>{ const it = items[+card.dataset.idx];
    card.querySelectorAll('.wset').forEach((row,s)=>{ const w=parseFloat(row.querySelector('[data-w]').value), r=parseInt(row.querySelector('[data-r]').value);
      if (w||r) extra.warmup_sets.push({exercise_id: it.exercise_id, exercise: it.exercise, set: s+1, weight: w||null, reps: r||null}); });
    const c = card.querySelector('.cardio'); if (c) { const o = {exercise_id: it.exercise_id, exercise: it.exercise};
      c.querySelectorAll('[data-c]').forEach(f=>{ if (f.value) o[f.dataset.c] = f.tagName==='SELECT' ? f.value : (f.dataset.c==='time' ? f.value : parseFloat(f.value)); });
      if (o.time || o.distance || o.watts || o.max_watts || o.cadence || o.cals || o.speed) extra.cardio.push(o); }
    const nt = card.querySelector('[data-note]'); if (nt && nt.value.trim()) (extra.notes ||= []).push({exercise_id: it.exercise_id, exercise: it.exercise, note: nt.value.trim()}); });
  const rows = [], sides = [], choices = [];
  document.querySelectorAll('.ex').forEach(card=>{
    const it = items[+card.dataset.idx], oi = +card.dataset.o || 0, md = modeOf(it, oi), exId = exIdOf(it, oi), opt = (optsOf(it) || [])[oi];
    let n = 0; card.querySelectorAll('.set').forEach(row=>{ const r2el = md.sides ? row.querySelector('[data-r2]') : null;
      let w = parseFloat(row.querySelector('[data-w]').value); const r = parseInt(row.querySelector('[data-r]').value) || 0, r2 = r2el ? parseInt(r2el.value) || 0 : 0;
      if (!(r || r2) || !exId) return; if (!w) { if (!md.bw) return; w = 0; }   // chin-ups: blank weight = bodyweight
      rows.push({member_id: member.id, exercise_id: exId, set_number: ++n, weight: w, reps: r2el ? (r && r2 ? Math.min(r, r2) : r || r2) : r});
      if (r2el) sides.push({exercise_id: exId, set: n, left: r || null, right: r2 || null}); });
    if (opt && n) choices.push({exercise_id: it.exercise_id, exercise: it.exercise, chose: opt.label});
  });
  extra.sides = sides; extra.choices = choices;
  const { data: wl, error } = await sb.from('workout_logs').insert({
    member_id: member.id, session_id: items[0] && items[0].session_id,
    entered_by: enteredBy, readiness_id: readiness && readiness.id, notes: JSON.stringify(extra) }).select().single();
  if (error) { alert('Could not save. Try again.'); $('saveBtn').disabled=false; return; }
  rows.forEach(r => r.workout_log_id = wl.id);
  if (rows.length) await sb.from('set_logs').insert(rows);
  // check what got beaten
  const today = new Date().toISOString().slice(0,10);
  const { data: newPr } = await sb.from('personal_records').select('pr_type,value,exercises(name)').eq('member_id',member.id).eq('achieved_on',today);
  const label = {heaviest:'Heaviest',est_5rm:'Est. 5RM',session_volume:'Volume'};
  const vs = updVol();
  $('saved').innerHTML = `<h3>Saved. Nice Work, ${member.first}.</h3>` +
    (vs.total ? `<div class="sumbox"><div class="sumh">Your Lift Summary</div>${vs.rows.map(r=>`<div class="sumr"><span>${r.name}</span><b>${fmt(r.lb)} lb</b></div>`).join('')}<div class="sumr tot"><span>Total Moved Today</span><b>${fmt(vs.total)} lb</b></div></div>` : '') +
    (newPr && newPr.length ? newPr.map(p=>`<div class="pr">🔥 New ${label[p.pr_type]} PR: ${p.exercises.name} ${p.value}</div>`).join('') : '<div>Logged. See you next session.</div>') +
    `<button class="main sec" onclick="showProgress('stepSession')">See My Progress</button><button class="main" onclick="location.reload()">Next Person</button>`;
  $('saved').classList.remove('hidden'); $('saveBtn').classList.add('hidden');
};
</script></body></html>
